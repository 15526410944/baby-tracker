    <style>/* ===== 字体引入 ===== */
@import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap');

/* ===== 基础重置 ===== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --primary: #E891A6;
    --primary-light: #F5C4D0;
    --primary-dark: #D4788C;
    --secondary: #FBE8EE;
    --accent: #E891A6;
    --bg: #FBF2F0;
    --card-bg: #FFFDF9;
    --text: #4A3F35;
    --text-light: #8B7E6E;
    --text-lighter: #B8A99A;
    --border: #F2DFE3;
    --shadow: 0 2px 12px rgba(210, 150, 160, 0.08);
    --shadow-hover: 0 4px 20px rgba(210, 150, 160, 0.15);
    --radius: 16px;
    --radius-sm: 10px;
    --header-h: 80px;
    --nav-h: 64px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Ma Shan Zheng', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
    font-size: 15px;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
}

button {
    border: none;
    background: none;
    cursor: pointer;
    font-family: inherit;
    font-size: inherit;
    color: inherit;
}

input, textarea, select {
    font-family: inherit;
    font-size: inherit;
    -webkit-appearance: none;
    border-radius: 0;
}

#app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
}

/* ===== 顶部状态栏 ===== */
.app-header {
    flex-shrink: 0;
    background: transparent;
    padding: var(--safe-top) 16px 10px;
    padding-top: calc(var(--safe-top) + 10px);
    z-index: 10;
    position: relative;
    margin-left: 64px;
}

.app-header::before {
    content: '';
    position: absolute;
    left: -64px;
    top: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, rgba(245, 220, 225, 0.6) 0%, rgba(240, 210, 215, 0.6) 100%);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: -1;
    border-radius: 0 0 0 16px;
}

.header-content {
    display: flex;
    align-items: center;
    justify-content: flex-start;
}

.header-logo {
    color: #D4859A;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
}

/* ===== 主内容区 ===== */
.app-main {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding: 16px;
    padding-bottom: 16px;
}

.page {
    display: none;
    padding: 16px;
    animation: fadeIn 0.3s ease;
}

.page.active {
    display: block;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ===== 首页仪表盘 ===== */
.dash-avatar-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 0 20px;
}

.dash-avatar-ring {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    padding: 3px;
    margin-bottom: 10px;
    box-shadow: 0 4px 16px rgba(255, 143, 163, 0.3);
}

.dash-avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: rgba(255,255,255,0.95);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.15s;
    background-size: cover;
    background-position: center;
    border: 2px solid #fff;
}

.dash-avatar:active {
    transform: scale(0.93);
}

.dash-baby-name {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 2px;
}

.dash-baby-age {
    font-size: 12px;
    color: var(--text-light);
    margin-bottom: 8px;
}

.dash-greeting {
    font-size: 14px;
    color: var(--primary-dark);
    font-weight: 500;
}

/* 今日概览大卡片 */
.dash-overview-card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 20px;
    box-shadow: var(--shadow);
    margin-bottom: 14px;
}

.dash-overview-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.dash-overview-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
}

.dash-overview-date {
    font-size: 12px;
    color: var(--text-light);
}

.dash-overview-stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 8px;
}

.dash-stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 4px;
    border-radius: 14px;
    background: #FFF5F7;
    cursor: pointer;
    transition: transform 0.15s, background 0.2s;
}

.dash-stat:active {
    transform: scale(0.95);
    background: #FFE4EC;
}

.dash-stat-icon {
    font-size: 22px;
    margin-bottom: 4px;
}

.dash-stat-value {
    font-size: 16px;
    font-weight: 700;
    color: var(--primary-dark);
    margin-bottom: 2px;
}

.dash-stat-label {
    font-size: 11px;
    color: var(--text-light);
}

/* 今日待办 */
.dash-todo-card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 20px;
    box-shadow: var(--shadow);
    margin-bottom: 14px;
}

.dash-todo-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}

.dash-todo-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
}

.dash-todo-count {
    font-size: 12px;
    color: var(--primary-dark);
    font-weight: 600;
    background: #FFF5F7;
    padding: 4px 10px;
    border-radius: 10px;
}

.dash-todo-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.dash-todo-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.2s;
    background: #FAFAFA;
}

.dash-todo-item:hover {
    background: #FFF5F7;
}

.dash-todo-item input[type="checkbox"] {
    display: none;
}

.todo-check {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid #DDD;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
}

.dash-todo-item input[type="checkbox"]:checked + .todo-check {
    background: var(--primary);
    border-color: var(--primary);
}

.dash-todo-item input[type="checkbox"]:checked + .todo-check::after {
    content: '✓';
    color: #fff;
    font-size: 12px;
    font-weight: 700;
}

.todo-text {
    font-size: 14px;
    color: var(--text);
    flex: 1;
}

.dash-todo-item input[type="checkbox"]:checked ~ .todo-text {
    color: var(--text-lighter);
    text-decoration: line-through;
}

/* 快捷操作 */
.dash-quick-actions {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 18px;
}

.dash-quick-btn {
    background: var(--card-bg);
    border-radius: 14px;
    padding: 12px 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    box-shadow: var(--shadow);
    transition: transform 0.15s, box-shadow 0.15s;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
}

.dash-quick-btn:active {
    transform: scale(0.95);
    box-shadow: var(--shadow-hover);
}

.dash-quick-icon {
    font-size: 22px;
}

/* 时间线标题 */
.dash-timeline-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.dash-timeline-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
}

.dash-timeline-clear {
    font-size: 12px;
    color: var(--primary-dark);
    padding: 4px 12px;
    border-radius: 12px;
    background: #FFF5F7;
    font-weight: 500;
    transition: background 0.2s;
}

.dash-timeline-clear:active {
    background: #FFE4EC;
}

/* ===== 时间线 ===== */
.timeline {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 12px 16px;
    box-shadow: var(--shadow);
    min-height: 80px;
}

.timeline-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    position: relative;
}

.timeline-item:last-child {
    border-bottom: none;
}

.timeline-time {
    font-size: 12px;
    color: var(--primary);
    font-weight: 600;
    white-space: nowrap;
    min-width: 44px;
}

.timeline-content {
    flex: 1;
    font-size: 14px;
    color: var(--text);
}

.timeline-content .timeline-icon {
    margin-right: 4px;
}

.empty-state {
    text-align: center;
    color: var(--text-lighter);
    font-size: 14px;
    padding: 20px 0;
}

/* ===== 健康档案 ===== */
.health-nav, .daily-nav {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 16px;
    padding-bottom: 4px;
}

.health-nav::-webkit-scrollbar, .daily-nav::-webkit-scrollbar {
    display: none;
}

.health-tab, .daily-tab {
    white-space: nowrap;
    padding: 10px 14px;
    border-radius: 12px;
    background: var(--card-bg);
    font-size: 13px;
    font-weight: 500;
    color: var(--text-light);
    box-shadow: var(--shadow);
    transition: all 0.2s;
    text-align: left;
}

.health-tab.active, .daily-tab.active {
    background: var(--primary);
    color: #fff;
}

.health-content, .daily-content {
    display: none;
}

.health-content.active, .daily-content.active {
    display: block;
}

/* ===== 早教导航 ===== */
.early-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
}

.early-tab {
    padding: 10px 14px;
    border-radius: 12px;
    background: var(--card-bg);
    font-size: 13px;
    font-weight: 500;
    color: var(--text-light);
    box-shadow: var(--shadow);
    transition: all 0.2s;
    cursor: pointer;
    border: none;
}

.early-tab.active {
    background: var(--primary);
    color: #fff;
}

.early-content {
    display: none;
}

.early-content.active {
    display: block;
}

/* ===== 购物模块 ===== */
.shopping-total-card {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: #fff;
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
    text-align: center;
}

.shopping-total-label {
    font-size: 13px;
    opacity: 0.85;
    margin-bottom: 4px;
}

.shopping-total-value {
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 2px;
}

.shopping-total-desc {
    font-size: 12px;
    opacity: 0.7;
}

.shopping-month-card {
    margin-bottom: 16px;
}

.shopping-month-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: var(--card-bg);
    border-radius: var(--radius) var(--radius) 0 0;
    border-bottom: 1px solid var(--border);
}

.shopping-month-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
}

.shopping-month-total {
    font-size: 18px;
    font-weight: 700;
    color: var(--primary);
}

.shopping-month-items {
    background: var(--card-bg);
    border-radius: 0 0 var(--radius) var(--radius);
    overflow: hidden;
}

.shopping-month-items .record-card {
    border-radius: 0;
    box-shadow: none;
    border-bottom: 1px solid var(--border);
    margin-bottom: 0;
}

.shopping-month-items .record-card:last-child {
    border-bottom: none;
    border-radius: 0 0 var(--radius) var(--radius);
}

/* ===== 日期选择器 ===== */
.daily-date-selector {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 16px;
}

.date-arrow {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--card-bg);
    font-size: 22px;
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow);
}

.date-arrow:active {
    background: var(--primary-light);
}

.date-display {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
}

/* ===== 记录列表 ===== */
.add-btn {
    width: 100%;
    background: var(--primary);
    color: #fff;
    padding: 12px;
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 12px;
    box-shadow: 0 4px 12px rgba(255, 143, 163, 0.3);
    transition: transform 0.15s;
}

.add-btn:active {
    transform: scale(0.97);
}

.record-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.record-card {
    background: var(--card-bg);
    border-radius: var(--radius-sm);
    padding: 14px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
}

.record-card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: var(--primary);
}

.record-card[data-type="medical"]::before { background: #FF8FA3; }
.record-card[data-type="vaccine"]::before { background: #B5EAD7; }
.record-card[data-type="checkup"]::before { background: #C7CEEA; }
.record-card[data-type="medication"]::before { background: #FFB7B2; }

.record-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 6px;
}

.record-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
}

.record-date {
    font-size: 12px;
    color: var(--text-light);
}

.record-detail {
    font-size: 13px;
    color: var(--text-light);
    line-height: 1.5;
}

.record-detail strong {
    color: var(--text);
    font-weight: 600;
}

.record-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
}

.record-tag {
    background: var(--primary-light);
    color: var(--primary-dark);
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 500;
}

.record-actions {
    position: absolute;
    top: 10px;
    right: 10px;
    display: flex;
    gap: 4px;
}

.record-edit {
    color: var(--text-lighter);
    font-size: 14px;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: all 0.2s;
    opacity: 0.5;
}

.record-edit:active {
    opacity: 1;
    color: #FF8FA3;
}

.record-delete {
    color: var(--text-lighter);
    font-size: 16px;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: all 0.2s;
    opacity: 0.5;
}

.record-delete:active {
    opacity: 1;
    color: #ff4444;
}

/* ===== 成长发育 ===== */
.growth-section {
    margin-bottom: 24px;
}

.growth-section-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 10px;
    color: var(--text);
}

.growth-stats {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
}

.growth-stat-card {
    flex: 1;
    background: var(--card-bg);
    border-radius: var(--radius-sm);
    padding: 12px;
    text-align: center;
    box-shadow: var(--shadow);
}

.growth-stat-label {
    font-size: 12px;
    color: var(--text-light);
    margin-bottom: 4px;
}

.growth-stat-value {
    font-size: 20px;
    font-weight: 700;
    color: var(--primary-dark);
}

.growth-stat-unit {
    font-size: 12px;
    color: var(--text-light);
}
.growth-stat-range {
    font-size: 10px;
    color: #999;
    margin-top: 4px;
    line-height: 1.3;
}

.chart-container {
    background: var(--card-bg);
    border-radius: var(--radius-sm);
    padding: 12px;
    box-shadow: var(--shadow);
    margin-bottom: 12px;
    min-height: 180px;
}

.chart-container canvas {
    width: 100% !important;
    height: 100% !important;
}

/* 里程碑 */
.milestone-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.milestone-card {
    background: var(--card-bg);
    border-radius: var(--radius-sm);
    padding: 14px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: flex-start;
    gap: 12px;
    position: relative;
}

.milestone-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
}

.milestone-info {
    flex: 1;
}

.milestone-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 4px;
}

.milestone-date {
    font-size: 12px;
    color: var(--text-light);
}

.milestone-note {
    font-size: 13px;
    color: var(--text-light);
    margin-top: 4px;
    line-height: 1.4;
}

/* ===== 日记 ===== */
.diary-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.diary-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
    position: relative;
}

.diary-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.diary-date {
    font-size: 13px;
    color: var(--primary);
    font-weight: 600;
}

.diary-mood {
    font-size: 22px;
}

.diary-content {
    font-size: 14px;
    color: var(--text);
    line-height: 1.6;
    white-space: pre-wrap;
}

.diary-images {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
    margin-top: 10px;
}

.diary-image {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 8px;
}

/* ===== 左侧边栏导航 ===== */
#app {
    flex-direction: row !important;
    max-width: none !important;
    height: 100vh;
    height: 100dvh;
}

.main-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    overflow: hidden;
    margin-left: 64px;
}

/* ===== 左侧边栏导航 - 极简图标风格 ===== */
.sidebar-nav {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: 64px;
    background: linear-gradient(180deg, rgba(245, 220, 225, 0.6) 0%, rgba(240, 210, 215, 0.6) 100%);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 0 12px;
    z-index: 100;
    color: #888;
    border-radius: 0;
}

.nav-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    color: #999;
    transition: all 0.2s;
    padding: 6px;
    border-radius: 12px;
    width: 52px;
    height: auto;
    min-height: 44px;
}

.nav-btn.active {
    background: rgba(255,255,255,0.3);
    transform: scale(1.05);
}

.sidebar-menu {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding-top: 20px;
}

.sidebar-footer {
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.2);
    width: 40px;
    display: flex;
    justify-content: center;
}

.nav-btn:active {
    background: rgba(255,255,255,0.15);
}

.nav-svg {
    width: 20px;
    height: 20px;
}

.nav-label {
    font-size: 11px;
    font-weight: 600;
    color: #666;
    line-height: 1.2;
}

/* ===== 模态框 ===== */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
}

.modal-overlay.active {
    display: flex;
    animation: fadeIn 0.2s ease;
}

.modal {
    background: var(--card-bg);
    width: 100%;
    max-width: 480px;
    max-height: 85vh;
    border-radius: 24px 24px 0 0;
    display: flex;
    flex-direction: column;
    animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    padding-bottom: var(--safe-bottom);
}

@keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
}

.modal-title {
    font-size: 17px;
    font-weight: 700;
}

.modal-close {
    font-size: 20px;
    color: var(--text-light);
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.modal-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.modal-footer {
    display: flex;
    gap: 12px;
    padding: 12px 20px;
    border-top: 1px solid var(--border);
}

.btn-cancel, .btn-confirm {
    flex: 1;
    padding: 12px;
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-weight: 600;
}

.btn-cancel {
    background: #f0f0f0;
    color: var(--text-light);
}

.btn-confirm {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 4px 12px rgba(255, 143, 163, 0.3);
}

.btn-confirm:active {
    transform: scale(0.97);
}

/* ===== 表单元素 ===== */
.form-group {
    margin-bottom: 16px;
}

.form-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
}

.form-label .required {
    color: #ff4444;
}

.form-input, .form-textarea, .form-select {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 15px;
    color: var(--text);
    background: #FAFAFA;
    transition: border-color 0.2s, background 0.2s;
}

.form-input:focus, .form-textarea:focus, .form-select:focus {
    outline: none;
    border-color: var(--primary);
    background: #fff;
}

.form-textarea {
    resize: none;
    min-height: 80px;
    line-height: 1.5;
}

.form-row {
    display: flex;
    gap: 12px;
}

.form-row .form-group {
    flex: 1;
}

.form-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.form-chip {
    padding: 8px 14px;
    border-radius: 20px;
    background: #f0f0f0;
    font-size: 13px;
    color: var(--text-light);
    transition: all 0.2s;
}

.form-chip.active {
    background: var(--primary);
    color: #fff;
}

.form-counter {
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: center;
}

.counter-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--primary-light);
    color: var(--primary-dark);
    font-size: 20px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
}

.counter-value {
    font-size: 20px;
    font-weight: 700;
    min-width: 50px;
    text-align: center;
}

.image-upload {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.image-upload-btn {
    width: 70px;
    height: 70px;
    border: 2px dashed var(--border);
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: var(--text-lighter);
    background: #FAFAFA;
}

.image-upload-btn:active {
    border-color: var(--primary);
}

.image-preview {
    width: 70px;
    height: 70px;
    border-radius: var(--radius-sm);
    object-fit: cover;
    position: relative;
}

/* ===== Toast ===== */
.toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: rgba(0,0,0,0.75);
    color: #fff;
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 14px;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    white-space: nowrap;
}

.toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
}

/* ===== 设置面板特殊样式 ===== */
.settings-section {
    margin-bottom: 20px;
}

.settings-section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-light);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.settings-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
}

.settings-item:last-child {
    border-bottom: none;
}

.settings-label {
    font-size: 15px;
    color: var(--text);
}

.settings-value {
    font-size: 14px;
    color: var(--text-light);
}

.danger-btn {
    width: 100%;
    padding: 12px;
    border-radius: var(--radius-sm);
    background: #fff0f0;
    color: #ff4444;
    font-size: 15px;
    font-weight: 600;
    margin-top: 20px;
}

/* ===== 安装提示 ===== */
.install-banner {
    position: fixed;
    bottom: 16px;
    left: 96px;
    right: 16px;
    max-width: 448px;
    margin: 0 auto;
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    display: none;
    align-items: center;
    gap: 12px;
    z-index: 50;
    animation: slideUp 0.3s ease;
}

.install-banner.show {
    display: flex;
}

.install-icon {
    font-size: 28px;
}

.install-text {
    flex: 1;
}

.install-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
}

.install-desc {
    font-size: 12px;
    color: var(--text-light);
    margin-top: 2px;
}

.install-action {
    background: var(--primary);
    color: #fff;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
}

.install-dismiss {
    color: var(--text-lighter);
    font-size: 18px;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* ===== 早教页面竖排布局 ===== */
.early-layout {
    display: flex;
    gap: 12px;
    min-height: 0;
}

.early-sidebar {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 56px;
    flex-shrink: 0;
    padding-top: 8px;
}

.early-nav-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 8px 4px;
    border-radius: 12px;
    background: var(--card-bg);
    box-shadow: var(--shadow);
    transition: all 0.2s;
    min-height: 52px;
}

.early-nav-btn.active {
    background: var(--primary);
    color: #fff;
    box-shadow: var(--shadow-hover);
}

.early-nav-icon {
    font-size: 18px;
    line-height: 1;
}

.early-nav-label {
    font-size: 10px;
    font-weight: 600;
    line-height: 1.2;
}

.early-main {
    flex: 1;
    min-width: 0;
    overflow-y: auto;
}

/* ===== 早教页面（旧样式兼容） ===== */
.early-nav {
    display: none;
}

.early-tab {
    display: none;
}

/* ===== 购物页面 ===== */
.shopping-summary {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
    display: flex;
    justify-content: space-around;

    <script>/**
 * 存储模块 - 使用 localStorage 持久化数据
 */

const Storage = {
    DB_KEY: 'baby_tracker_db',

    // 默认数据结构
    getDefaultDB() {
        return {
            baby: {
                name: '',
                gender: '',
                birthDate: '',
                avatar: '👶'
            },
            medical: [],      // 就医记录
            vaccine: [],      // 疫苗接种
            checkup: [],      // 儿保体检
            medication: [],   // 用药记录
            feeding: [],      // 喂养记录
            sleep: [],        // 睡眠记录
            outdoor: [],      // 户外活动
            story: [],        // 故事时间
            diaper: [],       // 尿布记录
            bath: [],         // 洗澡记录
            growth: [],       // 身高体重
            milestone: [],    // 发育里程碑
            motor: [],        // 运动发展
            diary: [],        // 成长日记
            shopping: [],     // 购物记录
            music: [],        // 音乐早教
            customEarly: [],  // 自定义早教
            vaccineCustom: [], // 自定义疫苗计划
            timeline: {},     // 按日期组织的每日时间线 { '2024-01-01': [...] }
            settings: {
                storyTime: '20:00',    // 默认故事时间
                outdoorGoal: 120,       // 户外目标分钟
                sleepGoal: 14,          // 睡眠目标小时
            }
        };
    },

    // 读取数据库
    load() {
        try {
            const data = localStorage.getItem(this.DB_KEY);
            if (!data) {
                const defaultDB = this.getDefaultDB();
                this.save(defaultDB);
                return defaultDB;
            }
            const db = JSON.parse(data);
            // 合并默认值，防止旧数据缺少新字段
            const defaults = this.getDefaultDB();
            return { ...defaults, ...db, baby: { ...defaults.baby, ...db.baby }, settings: { ...defaults.settings, ...db.settings } };
        } catch (e) {
            console.error('数据加载失败', e);
            return this.getDefaultDB();
        }
    },

    // 保存数据库
    save(db) {
        try {
            const data = JSON.stringify(db);
            localStorage.setItem(this.DB_KEY, data);
            return true;
        } catch (e) {
            console.error('数据保存失败', e);
            alert('⚠️ 存储空间不足！\\n\\n可能是照片太多导致超限。\\n建议：\\n1. 减少日记照片数量\\n2. 导出数据备份后清理\\n3. 每张照片建议不超过500KB');
            return false;
        }
    },

    // 添加记录
    add(type, data) {
        const db = this.load();
        const record = {
            id: Date.now() + '-' + Math.random().toString(36).substr(2, 6),
            createdAt: new Date().toISOString(),
            ...data
        };
        if (!db[type]) db[type] = [];
        db[type].unshift(record);
        this.save(db);
        return record;
    },

    // 删除记录
    delete(type, id) {
        const db = this.load();
        if (!db[type]) return;
        db[type] = db[type].filter(r => r.id !== id);
        this.save(db);
    },

    // 更新记录
    update(type, id, data) {
        const db = this.load();
        if (!db[type]) return;
        const idx = db[type].findIndex(r => r.id === id);
        if (idx >= 0) {
            db[type][idx] = { ...db[type][idx], ...data };
            this.save(db);
        }
    },

    // 获取某类型所有记录
    getAll(type) {
        const db = this.load();
        return db[type] || [];
    },

    // 按日期获取记录
    getByDate(type, dateStr) {
        const db = this.load();
        return (db[type] || []).filter(r => r.date === dateStr);
    },

    // 获取今天的记录
    getToday(type) {
        return this.getByDate(type, Utils.todayStr());
    },

    // 更新宝宝信息
    updateBaby(baby) {
        const db = this.load();
        db.baby = { ...db.baby, ...baby };
        this.save(db);
    },

    // 更新设置
    updateSettings(settings) {
        const db = this.load();
        db.settings = { ...db.settings, ...settings };
        this.save(db);
    },

    // 导出数据
    export() {
        return JSON.stringify(this.load(), null, 2);
    },

    // 导入数据
    import(jsonStr) {
        const data = JSON.parse(jsonStr);
        this.save(data);
    },

    // 清空所有数据
    clear() {
        localStorage.removeItem(this.DB_KEY);
    }
};

// 工具函数
const Utils = {
    // 今天的日期字符串
    todayStr() {
        return this.dateStr(new Date());
    },

    // 日期对象转字符串
    dateStr(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    },

    // 格式化日期显示
    formatDate(dateStr, withWeek = true) {
        if (!dateStr) return '';
        const date = new Date(dateStr);
        const month = date.getMonth() + 1;
        const day = date.getDate();
        let result = `${month}月${day}日`;
        if (withWeek) {
            const weeks = ['日', '一', '二', '三', '四', '五', '六'];
            result += ` 周${weeks[date.getDay()]}`;
        }
        return result;
    },

    // 格式化完整日期
    formatDateFull(dateStr) {
        if (!dateStr) return '';
        const date = new Date(dateStr);
        return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
    },

    // 格式化时间
    formatTime(timeStr) {
        if (!timeStr) return '';
        return timeStr.substring(0, 5);
    },

    // 计算宝宝年龄
    calcAge(birthDate) {
        if (!birthDate) return '';
        const birth = new Date(birthDate);
        const now = new Date();
        const diffMs = now - birth;
        if (diffMs < 0) return '未出生';

        const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
        const months = Math.floor(days / 30.44);
        const years = Math.floor(months / 12);

        if (years > 0) {
            const remainMonths = months % 12;
            return remainMonths > 0 ? `${years}岁${remainMonths}个月` : `${years}岁`;
        } else if (months > 0) {
            const remainDays = days - Math.floor(months * 30.44);
            return remainDays > 0 ? `${months}个月${remainDays}天` : `${months}个月`;
        } else {
            return `${days}天`;
        }
    },

    // 计算宝宝在某个日期的年龄
    calcAgeAt(birthDate, targetDate) {
        if (!birthDate || !targetDate) return '';
        const birth = new Date(birthDate);
        const target = new Date(targetDate);
        const diffMs = target - birth;
        if (diffMs < 0) return '';

        const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
        const months = Math.floor(days / 30.44);
        const years = Math.floor(months / 12);

        if (years > 0) {
            const remainMonths = months % 12;
            return remainMonths > 0 ? `${years}岁${remainMonths}个月` : `${years}岁`;
        } else if (months > 0) {
            const remainDays = days - Math.floor(months * 30.44);
            return remainDays > 0 ? `${months}个月${remainDays}天` : `${months}个月`;
        } else {
            return `${days}天`;
        }
    },
    daysDiff(dateStr1, dateStr2) {
        const d1 = new Date(dateStr1);
        const d2 = new Date(dateStr2);
        return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
    },

    // 获取问候语
    getGreeting() {
        const hour = new Date().getHours();
        if (hour < 6) return '夜安 ✨';
        if (hour < 11) return '早安 ☀️';
        if (hour < 14) return '中午好 ☁️';
        if (hour < 18) return '下午好 ☁️';
        if (hour < 22) return '晚上好 ⭐';
        return '夜深了 💤';
    },

    // 获取当前时间 HH:MM
    nowTime() {
        const now = new Date();
        return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    },

    // 日期加减
    addDays(dateStr, days) {
        const date = new Date(dateStr);
        date.setDate(date.getDate() + days);
        return this.dateStr(date);
    },

    // 判断是否今天
    isToday(dateStr) {
        return dateStr === this.todayStr();
    }
};

        1: {
            feeding: [
                { title: '判断奶量是否足够', content: '每天6片以上湿尿布、体重每周增长150-200g、喂养后宝宝满足安静，说明奶量充足。不要过度焦虑奶量。', source: 'WHO', tags: ['奶量', '体重'] },
                { title: '拍嗝很重要', content: '每次喂奶后竖抱拍嗝5-10分钟，减少吐奶和肠胀气。手掌空心状从下往上轻拍背部。', source: '崔玉涛', tags: ['拍嗝', '吐奶'] }
            ],
            education: [
                { title: '模仿表情游戏', content: '宝宝开始能模仿面部表情了。对着宝宝吐舌头、张嘴，等宝宝模仿。这锻炼面部肌肉和社交能力。', source: 'AAP', tags: ['模仿', '社交'] },
                { title: '摇铃听觉训练', content: '在宝宝头部两侧30cm处轻轻摇铃，观察宝宝是否会转头寻找声源。这能训练听觉定位能力。', source: 'AAP', tags: ['听觉', '追声'] }
            ],
            development: [
                { title: '社交性微笑', content: '满月前后宝宝开始出现社交性微笑，对人脸和声音报以微笑。这是亲子互动的重要里程碑，多逗宝宝笑。', source: 'AAP', tags: ['微笑', '社交'] },
                { title: '追视训练', content: '宝宝能追踪眼前20-30cm移动的物体。用红色小球或黑白卡片缓慢左右移动，训练眼球追视能力。', source: '崔玉涛', tags: ['视觉', '追视'] }
            ],
            sleep: [
                { title: '开始建立昼夜节律', content: '白天喂奶后保持一段清醒时间，房间保持明亮。晚上喂奶时灯光昏暗、动作轻柔，帮助宝宝区分白天和黑夜。', source: 'AAP', tags: ['昼夜', '节律'] },
                { title: '睡眠总量约15-16小时', content: '1个月宝宝每天睡15-16小时，白天3-4次小睡。夜间最长连续睡眠3-4小时属于正常。', source: 'WHO', tags: ['睡眠时长'] }
            ],
            health: [
                { title: '满月体检提醒', content: '满月时需做体检，检查体重、身高、头围增长情况，评估喂养效果。同时接种第二针乙肝疫苗。', source: '中国卫健委', tags: ['体检', '疫苗'] },
                { title: '肠绞痛应对', content: '若宝宝固定在傍晚大哭不止、难以安抚，可能是肠绞痛。尝试飞机抱、白噪音、按摩腹部缓解。一般4个月后会自行消失。', source: '崔玉涛', tags: ['肠绞痛', '哭闹'] }
            ],
            care: [
                { title: '皮肤保湿', content: '新生儿皮肤容易干燥，洗澡后3分钟内全身涂抹婴儿润肤乳，锁住水分。如出现湿疹，需加强保湿并就医。', source: 'AAP', tags: ['皮肤', '保湿', '湿疹'] },
                { title: '指甲护理', content: '宝宝指甲长得快，容易抓伤自己。在宝宝睡着时用婴儿指甲剪修剪，剪成圆弧形，不要剪太短。', source: 'AAP', tags: ['指甲', '修剪'] }
            ]
        },

        // ===== 2个月 =====
        2: {
            feeding: [
                { title: '建立喂养规律', content: '2个月宝宝约每3小时喂一次，每天6-8次。开始形成相对规律的喂养节奏，但仍以按需为主。', source: 'WHO', tags: ['规律', '喂养频率'] },
                { title: '维生素D补充', content: '纯母乳喂养宝宝每天需补充400IU维生素D。配方奶喂养宝宝如奶量充足可不用额外补充。', source: '中国卫健委', tags: ['维生素D', '补充'] }
            ],
            education: [
                { title: '多趴多练', content: '清醒时多趴着，每天累计至少30分钟。可以趴在妈妈胸口或垫子上，用玩具吸引抬头。锻炼颈背肌肉。', source: 'AAP', tags: ['tummy time', '抬头'] },
                { title: '发声回应', content: '宝宝开始发出"啊""哦"等元音。当宝宝发声时积极回应，模仿宝宝的声音，鼓励更多"对话"。', source: 'AAP', tags: ['语言', '发声'] }
            ],
            development: [
                { title: '头部控制增强', content: '竖抱时头部能短暂直立，俯卧时能抬头45度。多练习趴着，为翻身做准备。', source: 'AAP', tags: ['大运动', '抬头'] },
                { title: '手部开始张开', content: '从握拳状态逐渐张开手指，偶尔会抓握玩具。可以放摇铃在手中让宝宝练习抓握。', source: '崔玉涛', tags: ['精细动作', '抓握'] }
            ],
            sleep: [
                { title: '夜间睡眠延长', content: '部分宝宝夜间能睡4-6小时连续。可以开始建立睡前仪式：洗澡→按摩→喂奶→讲故事→关灯。', source: 'AAP', tags: ['夜间', '睡前仪式'] },
                { title: '小睡安排', content: '白天3次小睡，上午、中午、下午各一次。每次1-2小时。注意观察宝宝犯困信号及时安排小睡。', source: 'WHO', tags: ['小睡', '犯困信号'] }
            ],
            health: [
                { title: '2个月疫苗提醒', content: '需接种：脊灰疫苗第1剂、百白破第1剂、乙肝第2剂（如满月未接种）。接种后观察体温和局部反应。', source: '中国卫健委', tags: ['疫苗', '脊灰', '百白破'] },
                { title: '头型关注', content: '注意变换睡姿，白天多趴着，避免长时间同一姿势导致偏头。如发现明显偏头需咨询医生。', source: 'AAP', tags: ['头型', '偏头'] }
            ],
            care: [
                { title: '口水疹预防', content: '2个月开始流口水增多，及时擦干下巴和颈部，涂抹润肤霜隔离。选择柔软棉质口水巾。', source: '崔玉涛', tags: ['口水疹', '皮肤'] },
                { title: '户外活动开始', content: '天气好时可以带宝宝户外活动10-15分钟，接触自然光有助维生素D合成。避免阳光直射。', source: 'AAP', tags: ['户外', '阳光'] }
            ]
        },

        // ===== 3个月 =====
        3: {
            feeding: [
                { title: '奶量参考', content: '3个月宝宝每天奶量约600-800ml，每次120-150ml。不要过早添加辅食，WHO建议6个月内纯母乳喂养。', source: 'WHO', tags: ['奶量', '辅食'] },
                { title: '厌奶期应对', content: '部分宝宝3-4个月出现厌奶，吃奶量减少但精神好。不要强迫喂养，安静环境喂奶，通常1-2周恢复。', source: '崔玉涛', tags: ['厌奶', '应对'] }
            ],
            education: [
                { title: '照镜子游戏', content: '抱宝宝照镜子，宝宝会对镜中的"小伙伴"感兴趣。这有助于自我认知和社交发展。', source: 'AAP', tags: ['镜子', '认知'] },
                { title: '不同材质触摸', content: '提供丝绸、毛绒、硅胶等不同材质的物品让宝宝触摸，丰富触觉体验，促进感官发育。', source: 'AAP', tags: ['触觉', '感官'] }
            ],
            development: [
                { title: '翻身准备', content: '宝宝开始尝试从仰卧翻到侧卧。可以在侧面放玩具吸引宝宝翻身。多趴着是翻身的关键基础。', source: 'AAP', tags: ['翻身', '大运动'] },
                { title: '笑声出现', content: '3-4个月宝宝会发出咯咯笑声。多逗宝宝笑，挠痒痒、做鬼脸，笑是社交和情绪发展的重要标志。', source: 'AAP', tags: ['笑声', '社交'] }
            ],
            sleep: [
                { title: '睡眠总量14-15小时', content: '3个月宝宝每天睡14-15小时，夜间可能睡5-6小时连续。白天3次小睡，总时长3-4小时。', source: 'WHO', tags: ['睡眠时长'] },
                { title: '入睡能力培养', content: '尝试在宝宝犯困但还清醒时放到床上，让宝宝学习自主入睡。减少奶睡和抱睡依赖。', source: 'AAP', tags: ['自主入睡', '睡眠习惯'] }
            ],
            health: [
                { title: '3个月疫苗提醒', content: '需接种：脊灰疫苗第2剂、百白破第2剂。接种后多饮水，观察24小时体温变化。', source: '中国卫健委', tags: ['疫苗', '脊灰', '百白破'] },
                { title: '髋关节检查', content: '3个月体检时会检查髋关节发育情况。如有臀位产史或双腿纹不对称，需做B超排查发育性髋关节脱位。', source: 'AAP', tags: ['髋关节', '体检'] }
            ],
            care: [
                { title: '口水增多', content: '3个月后唾液腺发育，口水明显增多。及时擦拭，戴纯棉口水巾，下巴涂抹润肤霜防口水疹。', source: '崔玉涛', tags: ['口水', '护理'] },
                { title: '抓物入口', content: '宝宝开始抓东西往嘴里放，这是正常的探索方式。确保玩具干净安全，直径大于4cm防止误吞。', source: 'AAP', tags: ['安全', '探索'] }
            ]
        },

        // ===== 4个月 =====
        4: {
            feeding: [
                { title: '仍以奶为主', content: '4个月仍以母乳或配方奶为主，每天约800ml。不要急于加辅食，消化系统还需发育。如有过敏家族史，更不建议过早添加。', source: 'WHO', tags: ['纯奶', '辅食推迟'] },
                { title: '观察辅食信号', content: '如宝宝能竖头稳定、对食物感兴趣、舌挺反射消失，可咨询医生是否在4-6个月间开始尝试辅食。', source: '中国卫健委', tags: ['辅食信号', '准备'] }
            ],
            education: [
                { title: '因果关系游戏', content: '宝宝开始理解因果关系。提供按一下就响/动的玩具，让宝宝体验"我做了动作→产生结果"的因果联系。', source: 'AAP', tags: ['因果', '认知'] },
                { title: '名字认知', content: '经常叫宝宝名字，观察宝宝是否会转头回应。4-5个月开始对自己的名字有反应。', source: 'AAP', tags: ['名字', '认知'] }
            ],
            development: [
                { title: '翻身完成', content: '4-5个月大多数宝宝能从仰卧翻到俯卧。在床上或地垫上多练习，注意安全防护，避免从高处跌落。', source: 'AAP', tags: ['翻身', '大运动'] },
                { title: '主动抓握', content: '宝宝能主动伸手抓玩具，双手会互相传递物品。提供不同形状、声音的玩具锻炼手部技能。', source: '崔玉涛', tags: ['抓握', '精细动作'] }
            ],
            sleep: [
                { title: '4个月睡眠倒退', content: '常见睡眠倒退期！宝宝睡眠模式向成人转变，夜醒增多。保持一致睡前仪式，避免养成不良睡眠联想。通常2-4周好转。', source: 'AAP', tags: ['睡眠倒退', '夜醒'] },
                { title: '并觉期', content: '部分宝宝开始从3次小睡过渡到2次。观察宝宝下午小睡是否难以入睡，可能需要调整小睡安排。', source: 'WHO', tags: ['并觉', '小睡'] }
            ],
            health: [
                { title: '4个月疫苗提醒', content: '需接种：脊灰疫苗第3剂、百白破第3剂。这是基础免疫的最后一针，完成后抗体水平达到保护标准。', source: '中国卫健委', tags: ['疫苗', '基础免疫'] },
                { title: '出牙前兆', content: '部分宝宝4个月开始流口水增多、喜欢咬东西，是出牙前兆。可以准备牙胶冷藏后使用缓解牙龈不适。', source: '崔玉涛', tags: ['出牙', '牙胶'] }
            ],
            care: [
                { title: '坐姿练习', content: '可以靠坐在枕头或靠垫上短时间练习坐。不要时间太长，脊柱还不够有力。5-6个月能独坐。', source: 'AAP', tags: ['坐', '大运动'] },
                { title: '安全防护升级', content: '宝宝活动能力增强，检查家中安全。防撞角、插座保护盖、柜子固定等，为即将到来的爬行期做准备。', source: 'AAP', tags: ['安全', '防护'] }
            ]
        },

        // ===== 5个月 =====
        5: {
            feeding: [
                { title: '辅食准备期', content: '5个月可以开始让宝宝坐在餐椅上观察家人吃饭，感受用餐氛围。准备辅食工具：餐椅、硅胶碗勺、围嘴。', source: '中国卫健委', tags: ['辅食准备', '工具'] },
                { title: '铁储备下降', content: '5-6个月宝宝体内铁储备开始下降，需通过辅食补充铁。首推高铁米粉，用母乳或配方奶调配。', source: 'WHO', tags: ['补铁', '米粉'] }
            ],
            education: [
                { title: '积木游戏', content: '提供大块软积木，宝宝会抓握、敲打、传递。锻炼手眼协调和因果关系认知。', source: 'AAP', tags: ['积木', '手眼协调'] },
                { title: '躲猫猫', content: '用手遮住脸再露出，宝宝会觉得很有趣。这帮助宝宝理解"客体永久性"——东西看不见依然存在。', source: 'AAP', tags: ['躲猫猫', '认知'] }
            ],
            development: [
                { title: '独坐萌芽', content: '5个月宝宝可能短暂独坐几秒，但还不稳。多练习靠坐→扶坐→独坐，用玩具吸引向前伸手。', source: 'AAP', tags: ['独坐', '大运动'] },
                { title: '双脚交替蹬', content: '仰卧时双脚喜欢交替蹬踢，这是良好的运动信号。可以放响纸在脚下让蹬踢产生声音。', source: '崔玉涛', tags: ['运动', '腿部'] }
            ],
            sleep: [
                { title: '夜间睡眠延长', content: '部分宝宝夜间能连续睡6-8小时。白天2-3次小睡，总时长2-3小时。保持规律作息。', source: 'WHO', tags: ['夜间', '睡眠时长'] },
                { title: '分离焦虑初现', content: '5-6个月开始出现分离焦虑，睡前可能哭闹。建立固定的告别仪式，不要偷偷离开。', source: 'AAP', tags: ['分离焦虑', '情绪'] }
            ],
            health: [
                { title: '视力色彩发展', content: '5个月宝宝色觉基本发育完善，能分辨红黄蓝等颜色。提供彩色玩具和绘本，丰富视觉刺激。', source: 'AAP', tags: ['视力', '色彩'] },
                { title: '听力发育', content: '能转头寻找声源，对音乐有反应。可以播放轻柔音乐，但音量不宜过大，避免噪音损伤听力。', source: 'AAP', tags: ['听力', '音乐'] }
            ],
            care: [
                { title: '口腔清洁', content: '即使还没长牙，也要每天用纱布蘸温水擦拭牙龈。出牙后用婴儿软毛牙刷和米粒大小含氟牙膏清洁。', source: 'AAP', tags: ['口腔', '清洁'] },
                { title: '穿衣指南', content: '宝宝活动量大容易出汗，穿和大人一样多或少一件。选纯棉透气材质，方便活动的连体衣。', source: '崔玉涛', tags: ['穿衣', '透气'] }
            ]
        },

        // ===== 6个月 =====
        6: {
            feeding: [
                { title: '辅食正式开始！', content: '6个月正式添加辅食。第一口推荐高铁米粉，从稀到稠、从少到多。每次只加一种新食物，观察3-5天无过敏再加新的。', source: '中国卫健委', tags: ['辅食', '米粉', '高铁'] },
                { title: '辅食添加顺序', content: '强化铁米粉→蔬菜泥（根茎类→叶菜）→水果泥→蛋黄→肉泥。1岁内不加盐糖蜂蜜，不喝鲜牛奶。', source: 'WHO', tags: ['辅食顺序', '禁忌'] },
                { title: 'BLW自主进食', content: 'Baby-Led Weaning让宝宝自己抓食物吃。提供蒸软的胡萝卜条、牛油果块等手指食物，锻炼手眼协调和咀嚼能力。', source: 'AAP', tags: ['BLW', '手指食物'] }
            ],
            education: [
                { title: '绘本阅读启蒙', content: '6个月可以开始读绘本了！选择色彩鲜艳、有触摸元素的纸板书。每天5-10分钟，指认图片、模仿声音。', source: 'AAP', tags: ['绘本', '阅读'] },
                { title: '感官瓶DIY', content: '空水瓶装入水+食用色素+亮片，拧紧瓶盖。宝宝摇晃、观察、追踪，锻炼视觉追踪和因果认知。注意瓶盖牢固。', source: 'AAP', tags: ['感官', 'DIY'] },
                { title: '躲猫猫升级版', content: '把玩具藏在毯子下让宝宝找，或照镜子指认五官。这些游戏培养客体永久性和自我认知。', source: 'AAP', tags: ['认知', '游戏'] }
            ],
            development: [
                { title: '独坐稳定', content: '6个月大多数宝宝能独坐片刻，7-8个月坐稳。用玩具吸引宝宝坐起，周围放靠垫保护。', source: 'AAP', tags: ['独坐', '大运动'] },
                { title: '抓握精准', content: '能用拇指和食指配合抓小物品（不完全捏取）。提供溶豆、小馒头练习精细抓握，注意看护防误吞。', source: '崔玉涛', tags: ['精细动作', '抓握'] },
                { title: '叫名字有反应', content: '6个月宝宝对自己的名字有明显反应，会转头寻找。多叫名字加强认知，这也是听力正常的体现。', source: 'AAP', tags: ['名字', '认知'] }
            ],
            sleep: [
                { title: '6个月睡眠倒退', content: '辅食添加、大运动发展可能导致再次睡眠倒退。保持作息规律，夜间醒来先观察不要立即干预。', source: 'AAP', tags: ['睡眠倒退', '夜醒'] },
                { title: '白天2次小睡', content: '6个月通常过渡到2次小睡：上午1-1.5小时+下午1-1.5小时。夜间睡眠10-12小时。总睡眠12-14小时。', source: 'WHO', tags: ['小睡', '睡眠时长'] }
            ],
            health: [
                { title: '6个月疫苗提醒', content: '需接种：乙肝疫苗第3剂、A群流脑多糖疫苗第1剂。6个月后还需接种手足口疫苗（自费推荐）。', source: '中国卫健委', tags: ['疫苗', '乙肝', '流脑'] },
                { title: '出牙护理', content: '大部分宝宝6个月开始长第一颗牙。出牙时可能烦躁、流口水、低烧。用硅胶牙胶冷藏后咬，按摩牙龈缓解不适。', source: '崔玉涛', tags: ['出牙', '牙胶', '护理'] },
                { title: '贫血筛查', content: '6个月体检建议查血常规，排查缺铁性贫血。辅食添加含铁食物（强化米粉、红肉泥、蛋黄）预防贫血。', source: 'AAP', tags: ['贫血', '血常规'] }
            ],
            care: [
                { title: '口腔清洁升级', content: '第一颗牙萌出后就开始刷牙！用婴儿软毛牙刷+米粒大小含氟牙膏，每天2次。不要奶睡，预防奶瓶龋。', source: 'AAP', tags: ['刷牙', '含氟', '防龋'] },
                { title: '防晒很重要', content: '6个月后可以使用婴儿专用防晒霜（SPF30+）。外出前20分钟涂抹，每2小时补涂。戴帽子、穿防晒衣。', source: 'AAP', tags: ['防晒', '户外'] }
            ]
        },

        // ===== 7-8个月 =====
        '7-8': {
            feeding: [
                { title: '辅食质地升级', content: '从泥糊状过渡到颗粒状、碎末状。可以吃肉末、碎菜、软烂的面条粥。锻炼咀嚼能力，不能一直吃糊糊。', source: '中国卫健委', tags: ['辅食', '质地', '咀嚼'] },
                { title: '蛋白质多样化', content: '蛋黄→蛋白（如不过敏）、鸡肉泥→鱼肉泥（注意去刺）、豆腐。每种新食物观察3天，留意过敏反应。', source: 'WHO', tags: ['蛋白质', '过敏'] },
                { title: '手指食物', content: '提供煮软的胡萝卜条、土豆块、香蕉段等，让宝宝自己抓着吃。锻炼手眼协调和自主进食能力。', source: 'AAP', tags: ['手指食物', '自主进食'] }
            ],
            education: [
                { title: '敲打游戏', content: '给宝宝两个积木或勺子，让他敲打出声。这锻炼手眼协调、因果关系和节奏感。', source: 'AAP', tags: ['敲打', '节奏'] },
                { title: '指认图片', content: '和宝宝一起看绘本，指着图片说名称："这是小狗，汪汪汪"。重复多次后问"小狗在哪里"，观察宝宝是否会指。', source: 'AAP', tags: ['绘本', '指认'] },
                { title: '容器游戏', content: '给宝宝一个箱子和几个球，教他把球放进箱子再拿出来。理解"里面""外面"的空间概念。', source: 'AAP', tags: ['空间', '认知'] }
            ],
            development: [
                { title: '爬行开始', content: '7-8个月开始学爬，先从腹部贴地匍匐前进，逐渐学会手膝爬行。多趴、多在地上活动是关键。', source: 'AAP', tags: ['爬行', '大运动'] },
                { title: '扶站出现', content: '8个月左右会扶着家具站立。确保家具稳固安全，尖角防护。不要用学步车，影响自然运动发展。', source: 'AAP', tags: ['扶站', '安全'] },
                { title: '拇指食指捏取', content: '8-9个月发展出精细的拇指食指对捏。用溶豆、小馒头练习，这是精细动作的重要里程碑。', source: '崔玉涛', tags: ['捏取', '精细动作'] }
            ],
            sleep: [
                { title: '分离焦虑高峰', content: '7-9个月分离焦虑达到高峰，睡前哭闹增多。保持耐心，固定的睡前仪式和安全依恋很重要。peek-a-boo有帮助。', source: 'AAP', tags: ['分离焦虑', '睡前'] },
                { title: '并觉到2次小睡', content: '白天2次小睡：上午9-10点+下午1-3点。部分宝宝开始抗拒第三次小睡。夜间睡眠10-12小时。', source: 'WHO', tags: ['小睡', '并觉'] }
            ],
            health: [
                { title: '8个月疫苗提醒', content: '8个月接种：麻腮风疫苗第1剂、乙脑减毒活疫苗第1剂。接种后1-2周可能出现轻微发热或皮疹，属正常反应。', source: '中国卫健委', tags: ['疫苗', '麻腮风', '乙脑'] },
                { title: '幼儿急疹', content: '6-18个月高发。突发高烧3-5天，退烧后全身出疹。高烧时注意降温补水，出疹后即痊愈，预后良好。', source: '崔玉涛', tags: ['幼儿急疹', '发烧'] }
            ],
            care: [
                { title: '家居安全全面升级', content: '宝宝会爬会扶站了！全面检查：楼梯口安装护栏、家具固定上墙、尖锐角防护、电线隐藏、小物品收好。', source: 'AAP', tags: ['安全', '防护', '爬行'] },
                { title: '学饮杯过渡', content: '8个月开始学习用鸭嘴杯或吸管杯喝水，减少奶瓶使用。1岁后尽量戒除奶瓶，预防龋齿和咬合问题。', source: 'AAP', tags: ['学饮杯', '戒奶瓶'] }
            ]
        },

        // ===== 9-10个月 =====
        '9-10': {
            feeding: [
                { title: '一日三餐规律', content: '9个月后辅食变成正餐，每天3次辅食+2-3次奶。奶量保持500-600ml，辅食提供一半以上营养。', source: '中国卫健委', tags: ['三餐', '奶量'] },
                { title: '自主进食鼓励', content: '给宝宝勺子让他尝试自己吃，虽然会弄脏。这是独立性和手眼协调的重要练习。准备防水围嘴和地垫。', source: 'AAP', tags: ['自主进食', '勺子'] },
                { title: '食物多样性', content: '每天谷物+蔬菜+水果+肉蛋+豆制品。颜色越丰富营养越均衡。避免单一食物，培养不挑食习惯。', source: 'WHO', tags: ['多样', '均衡'] }
            ],
            education: [
                { title: '叠积木', content: '9-10个月可以教宝宝把2-3块大积木叠起来。锻炼手眼协调和空间感。积木倒了的"倒塌声"也是乐趣。', source: 'AAP', tags: ['积木', '手眼协调'] },
                { title: '模仿动作', content: '宝宝开始模仿大人的动作：拍手、挥手再见、摇头。多做夸张的动作让宝宝模仿，配合语言"再见""好棒"。', source: 'AAP', tags: ['模仿', '动作'] },
                { title: '音乐律动', content: '播放节奏鲜明的音乐，和宝宝一起拍手、摇摆。音乐促进大脑发育和节奏感。可以引入简单打击乐器。', source: 'AAP', tags: ['音乐', '律动'] }
            ],
            development: [
                { title: '扶走开始', content: '9-10个月会扶着家具移步，部分宝宝能独站片刻。不要急于让宝宝走路，多爬行有助于核心力量和协调。', source: 'AAP', tags: ['扶走', '爬行'] },
                { title: '理解简单指令', content: '能理解"不行""给我""过来"等简单指令。会用手指指东西表示需求。这是语言理解的重要进步。', source: 'AAP', tags: ['指令', '语言理解'] },
                { title: '物件永久性', content: '当着宝宝面把玩具藏到毯子下，宝宝会主动掀开找。说明已理解物体看不见依然存在。', source: 'AAP', tags: ['认知', '客体永久性'] }
            ],
            sleep: [
                { title: '睡眠总量12-14小时', content: '9-10个月每天睡12-14小时，夜间10-11小时，白天2次小睡共2-3小时。部分宝宝开始抗拒下午小睡。', source: 'WHO', tags: ['睡眠时长'] },
                { title: '夜醒应对', content: '大运动发展（学站学走）可能导致夜醒。如宝宝夜间站起来无法自己坐下，及时帮助但少干预。', source: 'AAP', tags: ['夜醒', '大运动'] }
            ],
            health: [
                { title: '9个月体检+疫苗', content: '9个月体检：评估生长发育、营养状况。需接种A群流脑多糖疫苗第2剂。检查血红蛋白排查贫血。', source: '中国卫健委', tags: ['体检', '疫苗', '贫血'] },
                { title: '便秘常见', content: '辅食增多后可能出现便秘。增加水分和膳食纤维（蔬菜水果），适当添加西梅汁、火龙果通便。', source: '崔玉涛', tags: ['便秘', '膳食纤维'] }
            ],
            care: [
                { title: '牙齿护理', content: '已有4-8颗牙，每天早晚用软毛牙刷+米粒大小含氟牙膏刷牙。睡前刷牙后不喝奶，定期看牙医。', source: 'AAP', tags: ['刷牙', '含氟'] },
                { title: '如厕训练准备', content: '9-12个月可以开始如厕训练准备：让宝宝坐马桶玩一会，建立马桶=安全的认知。真正训练通常18个月后。', source: 'AAP', tags: ['如厕', '准备'] }
            ]
        },

        // ===== 11-12个月 =====
        '11-12': {
            feeding: [
                { title: '过渡到家庭饮食', content: '1岁前后辅食质地接近成人，可吃小块软烂的家庭餐。盐糖仍需少加，但不需单独做。奶量保持400-500ml。', source: '中国卫健委', tags: ['家庭餐', '过渡'] },
                { title: '1岁后喝纯牛奶', content: '1岁后可以从配方奶过渡到全脂纯牛奶。每天300-400ml即可，不要过量影响正餐。2岁前不喝脱脂奶。', source: 'AAP', tags: ['纯牛奶', '1岁'] },
                { title: '自主进食', content: '鼓励宝宝自己用勺子吃饭，虽然会弄得到处都是。这是独立性和精细动作的重要发展。多鼓励少批评。', source: 'AAP', tags: ['自主', '勺子'] }
            ],
            education: [
                { title: '绘本互动阅读', content: '1岁宝宝能指认书中图片，会"咿咿呀呀"讲故事。多问"这是什么""在哪里"，鼓励宝宝指和发声。', source: 'AAP', tags: ['绘本', '互动'] },
                { title: '形状分类', content: '提供形状分类盒（圆形、方形），教宝宝把对应形状投入孔中。锻炼形状认知和手眼协调。', source: 'AAP', tags: ['形状', '认知'] },
                { title: '涂鸦启蒙', content: '给大蜡笔和白纸，让宝宝自由涂鸦。虽然只是乱画，但这是书写能力发展的起点。用可水洗蜡笔。', source: 'AAP', tags: ['涂鸦', '蜡笔'] }
            ],
            development: [
                { title: '独走里程碑', content: '12-15个月大多数宝宝开始独走。先扶走→独站→迈步。多鼓励，跌倒不要大惊小怪。每个宝宝节奏不同。', source: 'AAP', tags: ['独走', '大运动'] },
                { title: '第一个有意义的词', content: '12个月左右说出第一个有意义的词，通常是"妈妈""爸爸"。多和宝宝说话，描述日常事物促进语言发展。', source: 'AAP', tags: ['语言', '第一个词'] },
                { title: '会用手势沟通', content: '会指东西、挥手、伸手要抱。这是非语言沟通的重要方式。积极回应宝宝的手势，鼓励表达。', source: 'AAP', tags: ['手势', '沟通'] }
            ],
            sleep: [
                { title: '并觉到1次', content: '12-18个月从2次小睡过渡到1次午后小睡（1-2小时）。并觉期可能烦躁，调整需要1-2周。夜间11-12小时。', source: 'WHO', tags: ['并觉', '小睡'] },
                { title: '睡眠仪式固定', content: '固定流程：洗澡→刷牙→讲故事→关灯→睡觉。每天同一时间同一顺序，帮助建立稳定的睡眠节律。', source: 'AAP', tags: ['仪式', '规律'] }
            ],
            health: [
                { title: '1岁疫苗提醒', content: '12个月需接种：水痘疫苗第1剂。18个月接种麻腮风第2剂、甲肝疫苗、百白破加强针。按时接种很重要。', source: '中国卫健委', tags: ['疫苗', '水痘'] },
                { title: '1岁体检', content: '全面体检：身高体重头围、运动发育评估、视力听力筛查。检查血红蛋白和维生素D水平。建立生长曲线。', source: 'AAP', tags: ['体检', '发育评估'] }
            ],
            care: [
                { title: '如厕训练信号', content: '能保持2小时干爽、对马桶感兴趣、能听懂简单指令、会拉裤子，说明准备好如厕训练了。通常18-24个月开始。', source: 'AAP', tags: ['如厕', '信号'] },
                { title: '断奶瓶', content: '1岁后逐步戒除奶瓶，改用杯子喝奶。奶瓶使用过久影响牙齿咬合和口腔发育。最晚18个月完全戒除。', source: 'AAP', tags: ['断奶瓶', '杯子'] }
            ]
        },

        // ===== 13-18个月 =====
        '13-18': {
            feeding: [
                { title: '培养自主进食', content: '让宝宝自己用勺子吃饭，虽然会弄脏。提供手指食物和半固体食物。自主进食能培养独立性、手眼协调和食欲调节。', source: 'AAP', tags: ['自主进食', '独立性'] },
                { title: '饮食多样化', content: '每天谷物+蔬菜+水果+肉蛋奶+豆制品。颜色越丰富越好。和大人同桌吃饭，培养良好饮食习惯。', source: 'WHO', tags: ['多样', '均衡'] },
                { title: '控制糖和加工食品', content: '1岁半后仍需控制糖、盐、油炸食品。避免果汁（即使鲜榨）、零食、含糖酸奶。培养清淡口味。', source: '中国卫健委', tags: ['控糖', '健康饮食'] }
            ],
            education: [
                { title: '绘本亲子共读', content: '每天固定时间读绘本15-20分钟。指认图片、问简单问题、模仿动物叫声。这是语言和认知发展的黄金期。', source: 'AAP', tags: ['绘本', '语言'] },
                { title: '积木搭建', content: '能叠3-6块积木。提供各种形状的积木自由搭建，锻炼空间认知、创造力和手眼协调。', source: 'AAP', tags: ['积木', '空间'] },
                { title: '角色扮演', content: '开始假装游戏：喂娃娃吃饭、打电话、开汽车。这是认知发展的重要里程碑，培养想象力和社交能力。', source: 'AAP', tags: ['角色扮演', '想象'] }
            ],
            development: [
                { title: '走路稳→跑', content: '15个月走路基本稳定，18个月开始小跑。多户外活动，提供安全空间自由活动。上下楼梯开始学习。', source: 'AAP', tags: ['走路', '跑步', '大运动'] },
                { title: '词汇爆发', content: '18个月能说10-20个单字，开始说两个字组合"妈妈抱"。多和宝宝说话、讲故事，语言输入越多输出越快。', source: 'AAP', tags: ['语言', '词汇'] },
                { title: '精细动作', content: '会翻书页（不是一页一页）、用蜡笔画线、叠积木。提供蜡笔、纸张、大拼图锻炼手部精细能力。', source: '崔玉涛', tags: ['精细动作', '画画'] }
            ],
            sleep: [
                { title: '1次午睡', content: '13-18个月每天1次午睡1.5-2小时，夜间11-12小时。总睡眠12-13小时。固定午睡时间有助于作息规律。', source: 'WHO', tags: ['午睡', '作息'] }
            ],
            health: [
                { title: '18个月疫苗', content: '18个月接种：麻腮风第2剂、甲肝减毒活疫苗、百白破第4剂（加强）。完成后基础免疫基本结束。', source: '中国卫健委', tags: ['疫苗', '加强'] },
                { title: '视力关注', content: '注意观察是否有斜视、对眼、频繁揉眼。限制屏幕时间（不建议18个月以下看屏幕）。多户外活动预防近视。', source: 'AAP', tags: ['视力', '屏幕'] }
            ],
            care: [
                { title: '如厕训练开始', content: '18个月左右可以开始如厕训练。买儿童马桶、固定时间坐一坐、成功时及时表扬。训练可能需要3-6个月。', source: 'AAP', tags: ['如厕', '训练'] },
                { title: '刷牙自理', content: '让宝宝自己拿牙刷刷，家长再帮忙补刷。用豌豆大小含氟牙膏。每半年看一次牙医，涂氟防龋。', source: 'AAP', tags: ['刷牙', '含氟', '牙医'] }
            ]
        },

        // ===== 19-24个月 =====
        '19-24': {
            feeding: [
                { title: '和大人同桌吃饭', content: '2岁宝宝基本可以吃家庭餐，注意少盐少油。培养坐在餐椅上专心吃饭的习惯，不追喂不看电视吃饭。', source: '中国卫健委', tags: ['餐桌', '习惯'] },
                { title: '牛奶适量', content: '每天300-400ml牛奶或酸奶即可，过多影响正餐食欲。可以吃少量奶酪。1岁半后可以尝试坚果酱（非整粒）。', source: 'AAP', tags: ['奶量', '适量'] }
            ],
            education: [
                { title: '颜色和形状认知', content: '2岁能认识红黄蓝等颜色和圆形方形。通过玩具、绘本、日常物品教颜色形状："红色的苹果""圆圆的球"。', source: 'AAP', tags: ['颜色', '形状', '认知'] },
                { title: '简单拼图', content: '2-4块的大拼图适合这个年龄段。从凹凸匹配的形状拼图开始，培养空间认知和问题解决能力。', source: 'AAP', tags: ['拼图', '认知'] },
                { title: '唱儿歌', content: '2岁宝宝喜欢音乐和儿歌。一起唱《小星星》《两只老虎》等，配合动作。促进语言、节奏和记忆力。', source: 'AAP', tags: ['儿歌', '音乐'] }
            ],
            development: [

/**
 * 中国免疫规划疫苗程序表
 * 来源: 中国国家免疫规划
 */
const VaccineSchedule = {
    // 根据自定义疫苗列表计算提醒
    getReminders(vaccineList) {
        if (!vaccineList || vaccineList.length === 0) return [];
        const today = new Date();
        today.setHours(0,0,0,0);
        const weekLater = new Date(today);
        weekLater.setDate(weekLater.getDate() + 7);

        return vaccineList
            .filter(v => !v.completed)
            .map(v => {
                const planDate = new Date(v.planDate);
                planDate.setHours(0,0,0,0);
                const diffDays = Math.floor((planDate - today) / (1000*60*60*24));
                return { ...v, planDateObj: planDate, diffDays };
            })
            .sort((a, b) => a.diffDays - b.diffDays)
            .slice(0, 6); // 最多显示6条
    }
};

    // 本周数据统计
    renderWeekData() {
        const db = Storage.load();
        const today = new Date();
        const weekStart = new Date(today);
        weekStart.setDate(today.getDate() - today.getDay());
        const weekStartStr = Utils.dateStr(weekStart);

        // 本周户外时长
        let outdoorMins = 0;
        (db.outdoor || []).forEach(o => {
            if (o.date >= weekStartStr && o.duration) outdoorMins += parseInt(o.duration) || 0;
        });
        document.getElementById('weekOutdoor').textContent =
            outdoorMins >= 60 ? `${(outdoorMins/60).toFixed(1)}h` : `${outdoorMins}min`;

    // 首页推送精选
    renderDashPush() {
        const db = Storage.load();
        const ageBadge = document.getElementById('dashPushAge');
        const pushList = document.getElementById('dashPushList');

        if (!db.baby.birthDate) {
            pushList.innerHTML = '<div class="dash-push-item"><span class="dash-push-dot"></span><div class="dash-push-text">请先设置宝宝信息</div></div>';
            return;
        }

        const months = Math.floor((new Date() - new Date(db.baby.birthDate)) / (1000*60*60*24*30.44));
        const ageText = months > 0 ? `${months}个月` : '新生儿';
        if (ageBadge) ageBadge.textContent = `安安 · ${ageText}`;

        if (typeof PushData === 'undefined') {
            pushList.innerHTML = '<div class="dash-push-item"><span class="dash-push-dot"></span><div class="dash-push-text">推送内容加载中...</div></div>';
            return;
        }

        const pushes = PushData.getByMonth(months);
        const items = [];
        const keys = Object.keys(pushes);
        // 从每个分类取第一条
        keys.forEach(k => {
            if (pushes[k] && pushes[k].length > 0) {
                items.push({ cat: k, ...pushes[k][0] });
            }
        });

        if (items.length === 0) {
            pushList.innerHTML = '<div class="dash-push-item"><span class="dash-push-dot"></span><div class="dash-push-text">暂无推送</div></div>';
            return;
        }

        // 随机取3条
        const selected = items.sort(() => Math.random() - 0.5).slice(0, 3);
        const catIcons = { feeding: '🍽️', education: '🧩', development: '📈', sleep: '💤', health: '🩺', care: '👶' };

        pushList.innerHTML = selected.map(item => `
            <div class="dash-push-item">
                <span class="dash-push-dot"></span>
                <div class="dash-push-text">
                    ${item.title}
                    <span class="dash-push-tag">${catIcons[item.cat] || ''}</span>
                </div>
            </div>
        `).join('');

    // 疫苗提醒（自定义疫苗管理）
    renderVaccineReminder() {
        const db = Storage.load();
        const card = document.getElementById('dashVaccineCard');
        const list = document.getElementById('dashVaccineList');
        if (!card || !list) return;

        const vaccineList = db.vaccineCustom || [];
        const reminders = VaccineSchedule.getReminders(vaccineList);

        if (reminders.length === 0) {
            card.style.display = 'block';
            list.innerHTML = `
                <div style="text-align:center;padding:12px 0;color:#999;font-size:13px">
                    还没有添加疫苗计划<br>
                    <span style="font-size:12px">点击下方按钮自定义宝宝的接种计划</span>
                </div>
            `;
        } else {
            card.style.display = 'block';
            list.innerHTML = reminders.map(v => {
                let tagText = '', tagColor = '';
                if (v.diffDays < 0) {
                    tagText = `已过期${Math.abs(v.diffDays)}天`;
                    tagColor = '#E85D75';
                } else if (v.diffDays === 0) {
                    tagText = '今天';
                    tagColor = '#F0AD4E';
                } else if (v.diffDays <= 7) {
                    tagText = `还剩${v.diffDays}天`;
                    tagColor = '#5CB85C';
                } else {
                    tagText = `${v.diffDays}天后`;
                    tagColor = '#5B9BD5';
                }
                return `
                <div class="dash-vaccine-item">
                    <span class="dash-vaccine-dot" style="background:${tagColor}"></span>
                    <div class="dash-vaccine-text">
                        <strong>${this.escape(v.name)}</strong>
                        <span class="dash-push-tag" style="background:${tagColor}20;color:${tagColor}">${tagText}</span>
                        ${v.note ? '<div style="font-size:11px;color:#999;margin-top:2px">' + this.escape(v.note) + '</div>' : ''}
                        <div style="font-size:11px;color:#aaa">计划: ${v.planDate}</div>
                    </div>
                    <button style="font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid #5CB85C;color:#5CB85C;background:#fff;cursor:pointer;flex-shrink:0" onclick="App.completeVaccine('${v.id}')">✓</button>
                </div>
                `;
            }).join('');
        }

        // 添加管理按钮
        const existingBtn = card.querySelector('.dash-vaccine-manage');
        if (!existingBtn) {
            const manageBtn = document.createElement('div');
            manageBtn.className = 'dash-vaccine-manage';
            manageBtn.style.cssText = 'text-align:center;margin-top:8px';
            manageBtn.innerHTML = '<button style="font-size:12px;padding:6px 16px;border-radius:14px;border:1px dashed var(--primary);color:var(--primary);background:transparent;cursor:pointer">+ 管理疫苗计划</button>';
            manageBtn.querySelector('button').addEventListener('click', () => this.showVaccineManager());
            card.appendChild(manageBtn);
        }
    },

    completeVaccine(vaccineId) {
        const db = Storage.load();
        const list = db.vaccineCustom || [];
        const idx = list.findIndex(v => v.id === vaccineId);
        if (idx >= 0) {
            list[idx].completed = true;
            list[idx].completedDate = Utils.todayStr();
            Storage.save(db);
            this.renderVaccineReminder();
        }

    showVaccineManager() {
        const db = Storage.load();
        const list = db.vaccineCustom || [];
        
        const itemsHtml = list.length === 0 
            ? '<div style="text-align:center;color:#999;padding:20px">还没有疫苗计划，点击下方添加</div>'
            : list.sort((a,b) => {
                if (a.completed && !b.completed) return 1;
                if (!a.completed && b.completed) return -1;
                return new Date(a.planDate) - new Date(b.planDate);
            }).map(v => `
                <div class="vaccine-mgr-item" style="display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--border);${v.completed ? 'opacity:0.5' : ''}">

    addVaccineItem() {
        const nameInput = document.getElementById('vaccineNameInput');
        const dateInput = document.getElementById('vaccineDateInput');
        const noteInput = document.getElementById('vaccineNoteInput');
        const name = nameInput ? nameInput.value.trim() : '';
        const date = dateInput ? dateInput.value : '';
        const note = noteInput ? noteInput.value.trim() : '';
        
        if (!name) { alert('请输入疫苗名称'); return; }
        if (!date) { alert('请选择计划日期'); return; }

        const db = Storage.load();
        if (!db.vaccineCustom) db.vaccineCustom = [];
        db.vaccineCustom.push({
            id: Date.now().toString(),
            name, planDate: date, note, completed: false, completedDate: null
        });
        const saved = Storage.save(db);
        if (!saved) return;
        this.closeModal();
        this.renderVaccineReminder();
        this.showVaccineManager(); // 重新打开管理界面
    },

    deleteVaccineItem(vaccineId) {
        if (!confirm('确定删除这条疫苗计划吗？')) return;
        const db = Storage.load();
        if (!db.vaccineCustom) return;
        db.vaccineCustom = db.vaccineCustom.filter(v => v.id !== vaccineId);
        Storage.save(db);
        this.closeModal();
        this.renderVaccineReminder();
        this.showVaccineManager();
    },

    renderTimeline() {
        const db = Storage.load();
        const today = Utils.todayStr();
        const allRecords = [];

        // 收集今日所有记录
        ['feeding', 'sleep', 'diaper', 'bath'].forEach(type => {
            const records = Storage.getByDate(type, today);
            records.forEach(r => {
                allRecords.push({ ...r, _type: type });
            });
        });

        // 按时间排序
        allRecords.sort((a, b) => (b.time || '').localeCompare(a.time || ''));

        const container = document.getElementById('todayTimeline');
        if (allRecords.length === 0) {
            container.innerHTML = '<div class="empty-state">还没有记录，点击上方按钮开始吧</div>';
            return;
        }

        const typeMap = {
            feeding: { icon: '🍼', label: '喂奶' },
            sleep: { icon: '😴', label: '睡眠' },
            diaper: { icon: '🧷', label: '尿布' },
            bath: { icon: '🛁', label: '洗澡' }
        };

        container.innerHTML = allRecords.map(r => {
            const info = typeMap[r._type];
            let detail = '';
            if (r._type === 'feeding') {
                detail = `${r.feedType || ''} ${r.amount || ''}${r.unit || ''}`;
            } else if (r._type === 'sleep') {
                detail = `${r.duration || 0}分钟`;
            } else if (r._type === 'diaper') {
                detail = r.diaperType || '';
            } else if (r._type === 'bath') {
                detail = r.duration ? `${r.duration}分钟` : '';
            }

            return `
                <div class="timeline-item">
                    <div class="timeline-time">${r.time || ''}</div>
                    <div class="timeline-content">
                        <span class="timeline-icon">${info.icon}</span>
                        <strong>${info.label}</strong>
                        ${detail ? ' · ' + detail : ''}
                        ${r.note ? '<br><small style="color:#999">' + r.note + '</small>' : ''}
                    </div>
                </div>
            `;
        }).join('');
    },

    clearTodayTimeline() {
        if (!confirm('确定清空今日所有日常记录吗？（健康档案不受影响）')) return;
        const today = Utils.todayStr();
        const db = Storage.load();
        ['feeding', 'sleep', 'diaper', 'bath'].forEach(type => {

    // ===== 购物清单 =====
    renderShopping() {
        const records = Storage.getAll('shopping').sort((a, b) => new Date(b.date) - new Date(a.date));
        const container = document.getElementById('shoppingList');
        const summary = document.getElementById('shoppingSummary');

        if (records.length === 0) {
            summary.innerHTML = '';
            container.innerHTML = '<div class="empty-state">暂无购物记录，点击上方按钮开始记录吧</div>';
            return;
        }

        // 按月分组
        const groups = {};
        records.forEach(r => {
            const month = r.date ? r.date.substring(0, 7) : '未知';
            if (!groups[month]) groups[month] = { records: [], total: 0 };
            groups[month].records.push(r);
            groups[month].total += parseFloat(r.price) || 0;
        });

        // 总览
        const totalAll = Object.values(groups).reduce((sum, g) => sum + g.total, 0);
        summary.innerHTML = `
            <div class="shopping-total-card">
                <div class="shopping-total-label">📊 累计消费</div>
                <div class="shopping-total-value">¥${totalAll.toFixed(2)}</div>
                <div class="shopping-total-desc">共 ${records.length} 件物品</div>
            </div>
            <canvas id="shoppingCatChart" width="300" height="180" style="width:100%;max-width:100%;margin-top:12px;border-radius:12px;background:#fff"></canvas>
        `;

        // 绘制分类统计柱状图
        setTimeout(() => {
            const canvas = document.getElementById('shoppingCatChart');
            if (!canvas) return;
            const catTotals = {};
            records.forEach(r => {
                if (!r.price) return;
                const cats = (r.category || '其他').split(',');
                cats.forEach(c => {
                    const cat = c.trim();
                    if (!catTotals[cat]) catTotals[cat] = 0;
                    catTotals[cat] += parseFloat(r.price) || 0;
                });
            });
            const entries = Object.entries(catTotals).sort((a,b) => b[1] - a[1]);
            if (entries.length === 0) return;

            const dpr = window.devicePixelRatio || 1;
            const W = canvas.parentElement.clientWidth - 16;
            const H = 160;
            canvas.style.width = W + 'px';
            canvas.style.height = H + 'px';
            canvas.width = W * dpr;
            canvas.height = H * dpr;
            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);

            const colors = ['#E891A6','#F5A623','#5B9BD5','#5CB85C','#9B7EC4','#36B5B0','#F0AD4E'];
            const barW = Math.min(40, (W - 40) / entries.length - 8);
            const maxVal = Math.max(...entries.map(e => e[1]));
            entries.forEach(([cat, val], i) => {
                const x = 20 + i * (barW + 8);
                const barH = (val / maxVal) * (H - 40);
                ctx.fillStyle = colors[i % colors.length];
                ctx.fillRect(x, H - 20 - barH, barW, barH);
                ctx.fillStyle = '#666';
                ctx.font = '10px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('¥'+val.toFixed(0), x + barW/2, H - 24 - barH);
                ctx.fillText(cat, x + barW/2, H - 4);
            });
        }, 150);

        container.innerHTML = Object.entries(groups).map(([month, group]) => {
            const [y, m] = month.split('-');
            return `
                <div class="shopping-month-card">
                    <div class="shopping-month-header">
                        <div class="shopping-month-title">📅 ${y}年${parseInt(m)}月</div>
                        <div class="shopping-month-total">¥${group.total.toFixed(2)}</div>
                    </div>
                    <div class="shopping-month-items">
                        ${group.records.map(r => `
                            <div class="record-card" data-type="shopping">
                                <div class="record-card-header">
                                    <div class="record-title">🛍️ ${this.escape(r.item || '物品')}</div>
                                    <div class="record-date">${Utils.formatDateFull(r.date)}</div>
                                </div>
                                <div class="record-detail">
                                    ${r.category ? '<strong>分类：</strong>' + this.escape(r.category) + '<br>' : ''}
                                    <strong>价格：</strong>¥${parseFloat(r.price || 0).toFixed(2)}<br>
                                    ${r.rating ? '<strong>评分：</strong>' + '⭐'.repeat(parseInt(r.rating)) + '<br>' : ''}
                                    ${r.store ? '<strong>渠道：</strong>' + this.escape(r.store) + '<br>' : ''}
                                    ${r.note ? '<strong>感受：</strong>' + this.escape(r.note) : ''}
                                </div>
                                <div class="record-actions">
                                    <button class="record-edit" onclick="App.editShopping('${r.id}')">✏️</button>
                                    <button class="record-delete" onclick="App.deleteRecord('shopping','${r.id}')">🗑</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }).join('');
    },

    renderGrowthStats() {

        const latest = records[0];

        if (!latest) {
            container.innerHTML = '<div class="empty-state" style="grid-column:1/-1">暂无身高体重数据，点击上方按钮添加</div>';
            return;
        }

        // 计算 WHO 标准范围
        const db = Storage.load();
        const gender = db.baby.gender || 'girl';
        const birthDate = db.baby.birthDate;
        const whoData = (typeof WhoGrowth !== 'undefined') ? (WhoGrowth[gender] || WhoGrowth.girl) : null;
        let ageMonths = null, hRange = '', wRange = '';
        if (birthDate && latest.date) {
            ageMonths = parseFloat(((new Date(latest.date) - new Date(birthDate)) / (1000*60*60*24*30.44)).toFixed(1));
            if (whoData && ageMonths >= 0) {
                const closestMonth = Object.keys(whoData).map(Number).sort((a,b)=>a-b)
                    .reduce((prev, curr) => Math.abs(curr - ageMonths) < Math.abs(prev - ageMonths) ? curr : prev);
                const std = whoData[closestMonth];
                if (std) {
                    if (latest.height && std.height) hRange = `标准 P3-P97: ${std.height.p3}-${std.height.p97}cm`;
                    if (latest.weight && std.weight) wRange = `标准 P3-P97: ${std.weight.p3}-${std.weight.p97}kg`;
                }
            }
        }

        container.innerHTML = `
            <div class="growth-stat-card">
                <div class="growth-stat-label">身高</div>
                <div class="growth-stat-value">${latest.height || '-'}<span class="growth-stat-unit">cm</span></div>
                ${hRange ? '<div class="growth-stat-range">' + this.escape(hRange) + '</div>' : ''}
            </div>
            <div class="growth-stat-card">
                <div class="growth-stat-label">体重</div>
                <div class="growth-stat-value">${latest.weight || '-'}<span class="growth-stat-unit">kg</span></div>
                ${wRange ? '<div class="growth-stat-range">' + this.escape(wRange) + '</div>' : ''}

                <div class="growth-stat-label">头围</div>
