    <style>/* ===== 基础重置 ===== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --primary: #FFB6C1;
    --primary-light: #FFD0D8;
    --primary-dark: #FF9AAE;
    --secondary: #FFE4EC;
    --accent: #FFB6C1;
    --bg: #FFF0F3;
    --card-bg: #FFFFFF;
    --text: #3D3D3D;
    --text-light: #888888;
    --text-lighter: #BBBBBB;
    --border: #FFE4EC;
    --shadow: 0 2px 12px rgba(255, 143, 163, 0.1);
    --shadow-hover: 0 4px 20px rgba(255, 143, 163, 0.2);
    --radius: 16px;
    --radius-sm: 10px;
    --header-h: 80px;
    --nav-h: 64px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif;
    font-size: 15px;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
}

button {
    border: none;
    background: none;
    cursor: pointer;
    font-family: inherit;
    font-size: inherit;
    color: inherit;
}

input, textarea, select {
    font-family: inherit;
    font-size: inherit;
    -webkit-appearance: none;
    border-radius: 0;
}

#app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
}

/* ===== 顶部状态栏 ===== */
.app-header {
    flex-shrink: 0;
    background: transparent;
    padding: var(--safe-top) 16px 10px;
    padding-top: calc(var(--safe-top) + 10px);
    z-index: 10;
    position: relative;
    margin-left: 64px;
}

.app-header::before {
    content: '';
    position: absolute;
    left: -64px;
    top: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, rgba(255, 182, 193, 0.75) 0%, rgba(255, 154, 174, 0.75) 100%);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: -1;
    border-radius: 0 0 16px 0;
}

.header-content {
    display: flex;
    align-items: center;
    justify-content: flex-start;
}

.header-logo {
    color: #999;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
}

/* ===== 主内容区 ===== */
.app-main {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding: 16px;
    padding-bottom: 16px;
}

.page {
    display: none;
    padding: 16px;
    animation: fadeIn 0.3s ease;
}

.page.active {
    display: block;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ===== 首页仪表盘 ===== */
.dash-avatar-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 0 20px;
}

.dash-avatar-ring {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    padding: 3px;
    margin-bottom: 10px;
    box-shadow: 0 4px 16px rgba(255, 143, 163, 0.3);
}

.dash-avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: rgba(255,255,255,0.95);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.15s;
    background-size: cover;
    background-position: center;
    border: 2px solid #fff;
}

.dash-avatar:active {
    transform: scale(0.93);
}

.dash-baby-name {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 2px;
}

.dash-baby-age {
    font-size: 12px;
    color: var(--text-light);
    margin-bottom: 8px;
}

.dash-greeting {
    font-size: 14px;
    color: var(--primary-dark);
    font-weight: 500;
}

/* 今日概览大卡片 */
.dash-overview-card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 20px;
    box-shadow: var(--shadow);
    margin-bottom: 14px;
}

.dash-overview-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.dash-overview-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
}

.dash-overview-date {
    font-size: 12px;
    color: var(--text-light);
}

.dash-overview-stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 8px;
}

.dash-stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 4px;
    border-radius: 14px;
    background: #FFF5F7;
    cursor: pointer;
    transition: transform 0.15s, background 0.2s;
}

.dash-stat:active {
    transform: scale(0.95);
    background: #FFE4EC;
}

.dash-stat-icon {
    font-size: 22px;
    margin-bottom: 4px;
}

.dash-stat-value {
    font-size: 16px;
    font-weight: 700;
    color: var(--primary-dark);
    margin-bottom: 2px;
}

.dash-stat-label {
    font-size: 11px;
    color: var(--text-light);
}

/* 今日待办 */
.dash-todo-card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 20px;
    box-shadow: var(--shadow);
    margin-bottom: 14px;
}

.dash-todo-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}

.dash-todo-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
}

.dash-todo-count {
    font-size: 12px;
    color: var(--primary-dark);
    font-weight: 600;
    background: #FFF5F7;
    padding: 4px 10px;
    border-radius: 10px;
}

.dash-todo-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.dash-todo-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.2s;
    background: #FAFAFA;
}

.dash-todo-item:hover {
    background: #FFF5F7;
}

.dash-todo-item input[type="checkbox"] {
    display: none;
}

.todo-check {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid #DDD;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
}

.dash-todo-item input[type="checkbox"]:checked + .todo-check {
    background: var(--primary);
    border-color: var(--primary);
}

.dash-todo-item input[type="checkbox"]:checked + .todo-check::after {
    content: '✓';
    color: #fff;
    font-size: 12px;
    font-weight: 700;
}

.todo-text {
    font-size: 14px;
    color: var(--text);
    flex: 1;
}

.dash-todo-item input[type="checkbox"]:checked ~ .todo-text {
    color: var(--text-lighter);
    text-decoration: line-through;
}

/* 快捷操作 */
.dash-quick-actions {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 18px;
}

.dash-quick-btn {
    background: var(--card-bg);
    border-radius: 14px;
    padding: 12px 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    box-shadow: var(--shadow);
    transition: transform 0.15s, box-shadow 0.15s;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
}

.dash-quick-btn:active {
    transform: scale(0.95);
    box-shadow: var(--shadow-hover);
}

.dash-quick-icon {
    font-size: 22px;
}

/* 时间线标题 */
.dash-timeline-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.dash-timeline-title {
    font-size: 17px;
    font-weight: 700;

    <script>/**
 * 存储模块 - 使用 localStorage 持久化数据
 */

const Storage = {
    DB_KEY: 'baby_tracker_db',

    // 默认数据结构
    getDefaultDB() {
        return {
            baby: {
                name: '',
                gender: '',
                birthDate: '',
                avatar: '👶'
            },
            medical: [],      // 就医记录
            vaccine: [],      // 疫苗接种
            checkup: [],      // 儿保体检
            medication: [],   // 用药记录
            feeding: [],      // 喂养记录
            sleep: [],        // 睡眠记录
            outdoor: [],      // 户外活动
            story: [],        // 故事时间
            diaper: [],       // 尿布记录
            bath: [],         // 洗澡记录
            growth: [],       // 身高体重
            milestone: [],    // 发育里程碑
            motor: [],        // 运动发展
            diary: [],        // 成长日记
            timeline: {},     // 按日期组织的每日时间线 { '2024-01-01': [...] }
            settings: {
                storyTime: '20:00',    // 默认故事时间
                outdoorGoal: 120,       // 户外目标分钟
                sleepGoal: 14,          // 睡眠目标小时
            }
        };
    },

    // 读取数据库
    load() {
        try {
            const data = localStorage.getItem(this.DB_KEY);
            if (!data) {
                const defaultDB = this.getDefaultDB();
                this.save(defaultDB);
                return defaultDB;
            }
            const db = JSON.parse(data);
            // 合并默认值，防止旧数据缺少新字段
            const defaults = this.getDefaultDB();
            return { ...defaults, ...db, baby: { ...defaults.baby, ...db.baby }, settings: { ...defaults.settings, ...db.settings } };
        } catch (e) {
            console.error('数据加载失败', e);
            return this.getDefaultDB();
        }
    },

    // 保存数据库
    save(db) {
        try {
            localStorage.setItem(this.DB_KEY, JSON.stringify(db));
        } catch (e) {
            console.error('数据保存失败', e);
            alert('存储空间不足，请清理旧数据');
        }
    },

    // 添加记录
    add(type, data) {
        const db = this.load();
        const record = {
            id: Date.now() + '-' + Math.random().toString(36).substr(2, 6),
            createdAt: new Date().toISOString(),
            ...data
        };
        if (!db[type]) db[type] = [];
        db[type].unshift(record);
        this.save(db);
        return record;
    },

    // 删除记录
    delete(type, id) {
        const db = this.load();
        if (!db[type]) return;
        db[type] = db[type].filter(r => r.id !== id);
        this.save(db);
    },

    // 更新记录
    update(type, id, data) {
        const db = this.load();
        if (!db[type]) return;
        const idx = db[type].findIndex(r => r.id === id);
        if (idx >= 0) {
            db[type][idx] = { ...db[type][idx], ...data };
            this.save(db);
        }
    },

    // 获取某类型所有记录
    getAll(type) {
        const db = this.load();
        return db[type] || [];
    },

    // 按日期获取记录
    getByDate(type, dateStr) {
        const db = this.load();
        return (db[type] || []).filter(r => r.date === dateStr);
    },

    // 获取今天的记录
    getToday(type) {
        return this.getByDate(type, Utils.todayStr());
    },

    // 更新宝宝信息
    updateBaby(baby) {
        const db = this.load();
        db.baby = { ...db.baby, ...baby };
        this.save(db);
    },

    // 更新设置
    updateSettings(settings) {
        const db = this.load();
        db.settings = { ...db.settings, ...settings };
        this.save(db);
    },

    // 导出数据
    export() {
        return JSON.stringify(this.load(), null, 2);
    },

    // 导入数据
    import(jsonStr) {
        const data = JSON.parse(jsonStr);
        this.save(data);
    },

    // 清空所有数据
    clear() {
        localStorage.removeItem(this.DB_KEY);
    }
};

// 工具函数
const Utils = {
    // 今天的日期字符串
    todayStr() {
        return this.dateStr(new Date());
    },

    // 日期对象转字符串
    dateStr(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    },

    // 格式化日期显示
    formatDate(dateStr, withWeek = true) {
        if (!dateStr) return '';
        const date = new Date(dateStr);
        const month = date.getMonth() + 1;
        const day = date.getDate();
        let result = `${month}月${day}日`;
        if (withWeek) {
            const weeks = ['日', '一', '二', '三', '四', '五', '六'];
            result += ` 周${weeks[date.getDay()]}`;
        }
        return result;
    },

    // 格式化完整日期
    formatDateFull(dateStr) {
        if (!dateStr) return '';
        const date = new Date(dateStr);
        return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
    },

    // 格式化时间
    formatTime(timeStr) {
        if (!timeStr) return '';
        return timeStr.substring(0, 5);
    },

    // 计算宝宝年龄
    calcAge(birthDate) {
        if (!birthDate) return '';
        const birth = new Date(birthDate);
        const now = new Date();
        const diffMs = now - birth;
        if (diffMs < 0) return '未出生';

        const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
        const months = Math.floor(days / 30.44);
        const years = Math.floor(months / 12);

        if (years > 0) {
            const remainMonths = months % 12;
            return remainMonths > 0 ? `${years}岁${remainMonths}个月` : `${years}岁`;
        } else if (months > 0) {
            const remainDays = days - Math.floor(months * 30.44);
            return remainDays > 0 ? `${months}个月${remainDays}天` : `${months}个月`;
        } else {
            return `${days}天`;
        }
    },

    // 计算宝宝在某个日期的年龄
    calcAgeAt(birthDate, targetDate) {
        if (!birthDate || !targetDate) return '';
        const birth = new Date(birthDate);
        const target = new Date(targetDate);
        const diffMs = target - birth;
        if (diffMs < 0) return '';

        const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
        const months = Math.floor(days / 30.44);
        const years = Math.floor(months / 12);

        if (years > 0) {
            const remainMonths = months % 12;
            return remainMonths > 0 ? `${years}岁${remainMonths}个月` : `${years}岁`;
        } else if (months > 0) {
            const remainDays = days - Math.floor(months * 30.44);
            return remainDays > 0 ? `${months}个月${remainDays}天` : `${months}个月`;
        } else {
            return `${days}天`;
        }
    },
    daysDiff(dateStr1, dateStr2) {
        const d1 = new Date(dateStr1);
        const d2 = new Date(dateStr2);
        return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
    },

    // 获取问候语
    getGreeting() {
        const hour = new Date().getHours();
        if (hour < 6) return '夜安 ✨';
        if (hour < 11) return '早安 ☀️';
        if (hour < 14) return '中午好 ☁️';
        if (hour < 18) return '下午好 ☁️';
        if (hour < 22) return '晚上好 ⭐';
        return '夜深了 💤';
    },

    // 获取当前时间 HH:MM
    nowTime() {
        const now = new Date();
        return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    },

    // 日期加减
    addDays(dateStr, days) {
        const date = new Date(dateStr);
        date.setDate(date.getDate() + days);
        return this.dateStr(date);
    },

    // 判断是否今天
    isToday(dateStr) {
        return dateStr === this.todayStr();
    }
};

/**
 * 宝宝成长记 - 主应用逻辑
 */

const App = {
    currentDate: Utils.todayStr(),  // 日常记录当前查看日期
    modalCallback: null,             // 模态框确认回调
    deferredPrompt: null,            // PWA安装事件

    init() {
        this.bindEvents();
        this.checkBabyInfo();
        this.renderDashboard();
        this.renderAll();
        this.registerSW();
        this.showInstallPrompt();
    },

    // ===== 事件绑定 =====
    bindEvents() {
        // 侧边栏导航 - 只绑定菜单里的 nav-btn
        document.querySelectorAll('.sidebar-menu .nav-btn').forEach(btn => {
            btn.addEventListener('click', () => this.switchPage(btn.dataset.page));
        });

        // 侧边栏设置按钮
        const sidebarSettings = document.getElementById('sidebarSettings');
        if (sidebarSettings) {
            sidebarSettings.addEventListener('click', () => this.showSettings());
        }

        // 头像点击上传
        const fileInput = document.getElementById('avatarFileInput');
        const handleAvatarClick = () => {
            if (fileInput) fileInput.click();
        };
        const dashAvatar = document.getElementById('dashAvatar');
        if (dashAvatar) dashAvatar.addEventListener('click', handleAvatarClick);
        const babyAvatar = document.getElementById('babyAvatar');
        if (babyAvatar) babyAvatar.addEventListener('click', handleAvatarClick);
        const sidebarAvatar = document.getElementById('sidebarAvatar');
        if (sidebarAvatar) sidebarAvatar.addEventListener('click', handleAvatarClick);

        // 文件选择处理
        if (fileInput) {
            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 2 * 1024 * 1024) {
                    this.toast('图片不能超过2MB哦');
                    return;
                }
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const db = Storage.load();
                    db.baby.avatar = ev.target.result;
                    Storage.save(db);
                    this.renderBabyInfo();
                    this.toast('头像更新成功');
                };

    renderTimeline() {
        const db = Storage.load();
        const today = Utils.todayStr();
        const allRecords = [];

        // 收集今日所有记录
        ['feeding', 'sleep', 'outdoor', 'story', 'diaper', 'bath'].forEach(type => {
            const records = Storage.getByDate(type, today);
            records.forEach(r => {
                allRecords.push({ ...r, _type: type });
            });
        });

        // 按时间排序
        allRecords.sort((a, b) => (b.time || '').localeCompare(a.time || ''));

        const container = document.getElementById('todayTimeline');
        if (allRecords.length === 0) {
            container.innerHTML = '<div class="empty-state">还没有记录，点击上方按钮开始吧</div>';
            return;
        }

        const typeMap = {
            feeding: { icon: '🍼', label: '喂奶' },
            sleep: { icon: '😴', label: '睡眠' },
            outdoor: { icon: '🌳', label: '户外' },
            story: { icon: '📖', label: '故事' },
            diaper: { icon: '🧷', label: '尿布' },
            bath: { icon: '🛁', label: '洗澡' }
        };

        container.innerHTML = allRecords.map(r => {
            const info = typeMap[r._type];
            let detail = '';
            if (r._type === 'feeding') {
                detail = `${r.feedType || ''} ${r.amount || ''}${r.unit || ''}`;
            } else if (r._type === 'sleep') {
                detail = `${r.duration || 0}分钟`;
            } else if (r._type === 'outdoor') {
                detail = `${r.duration || 0}分钟 ${r.activity || ''}`;
            } else if (r._type === 'story') {
                detail = r.bookName || r.content || '';
            } else if (r._type === 'diaper') {
                detail = r.diaperType || '';
            } else if (r._type === 'bath') {
                detail = r.duration ? `${r.duration}分钟` : '';
            }

            return `
                <div class="timeline-item">
                    <div class="timeline-time">${r.time || ''}</div>
                    <div class="timeline-content">
                        <span class="timeline-icon">${info.icon}</span>
                        <strong>${info.label}</strong>
                        ${detail ? ' · ' + detail : ''}
                        ${r.note ? '<br><small style="color:#999">' + r.note + '</small>' : ''}
                    </div>
                </div>
            `;
        }).join('');
    },

    clearTodayTimeline() {
        if (!confirm('确定清空今日所有日常记录吗？（健康档案不受影响）')) return;
        const today = Utils.todayStr();
        const db = Storage.load();
        ['feeding', 'sleep', 'outdoor', 'story', 'diaper', 'bath'].forEach(type => {
            db[type] = db[type].filter(r => r.date !== today);
        });
        Storage.save(db);
        this.renderDashboard();
        this.toast('已清空今日记录');
    },

    drawGrowthChart(records) {
        const canvas = document.getElementById('growthChart');
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);

        const w = rect.width;
        const h = rect.height;
        const padding = { top: 20, right: 20, bottom: 30, left: 35 };
        const chartW = w - padding.left - padding.right;
        const chartH = h - padding.top - padding.bottom;

        ctx.clearRect(0, 0, w, h);

        if (records.length === 0) return;

        const heights = records.map(r => parseFloat(r.height)).filter(v => !isNaN(v));
        const weights = records.map(r => parseFloat(r.weight)).filter(v => !isNaN(v));

        if (heights.length === 0 && weights.length === 0) return;

        const minH = Math.min(...heights) * 0.9;
        const maxH = Math.max(...heights) * 1.1;
        const minW = Math.min(...weights) * 0.9;
        const maxW = Math.max(...weights) * 1.1;

        // 绘制坐标轴
        ctx.strokeStyle = '#eee';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(padding.left, padding.top);
        ctx.lineTo(padding.left, h - padding.bottom);
        ctx.lineTo(w - padding.right, h - padding.bottom);
        ctx.stroke();

        // 绘制身高曲线
        if (heights.length > 0) {
            ctx.strokeStyle = '#FF8FA3';
            ctx.lineWidth = 2;
            ctx.beginPath();
            records.forEach((r, i) => {
                const h = parseFloat(r.height);
                if (isNaN(h)) return;
                const x = padding.left + (chartW / Math.max(records.length - 1, 1)) * i;
                const y = padding.top + chartH - ((h - minH) / (maxH - minH || 1)) * chartH;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();

            // 绘制点
            ctx.fillStyle = '#FF8FA3';
            records.forEach((r, i) => {
                const h = parseFloat(r.height);
                if (isNaN(h)) return;
                const x = padding.left + (chartW / Math.max(records.length - 1, 1)) * i;
                const y = padding.top + chartH - ((h - minH) / (maxH - minH || 1)) * chartH;
                ctx.beginPath();
                ctx.arc(x, y, 3, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // 绘制体重曲线
        if (weights.length > 0) {
            ctx.strokeStyle = '#B5EAD7';
            ctx.lineWidth = 2;
            ctx.beginPath();
            records.forEach((r, i) => {
                const wt = parseFloat(r.weight);
                if (isNaN(wt)) return;
                const x = padding.left + (chartW / Math.max(records.length - 1, 1)) * i;
                const y = padding.top + chartH - ((wt - minW) / (maxW - minW || 1)) * chartH;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();

            ctx.fillStyle = '#4CAF50';
            records.forEach((r, i) => {
                const wt = parseFloat(r.weight);
                if (isNaN(wt)) return;
                const x = padding.left + (chartW / Math.max(records.length - 1, 1)) * i;
                const y = padding.top + chartH - ((wt - minW) / (maxW - minW || 1)) * chartH;
                ctx.beginPath();
                ctx.arc(x, y, 3, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // 图例
        ctx.font = '11px sans-serif';
        ctx.fillStyle = '#FF8FA3';
        ctx.fillRect(padding.left, 4, 10, 3);
        ctx.fillStyle = '#888';
        ctx.fillText('身高', padding.left + 14, 10);
        ctx.fillStyle = '#4CAF50';
        ctx.fillRect(padding.left + 50, 4, 10, 3);
        ctx.fillStyle = '#888';
        ctx.fillText('体重', padding.left + 64, 10);
    },

    editRecord(type, id) {
        const db = Storage.load();
        const record = (db[type] || []).find(r => r.id === id);
        if (!record) return;

        // 构建通用编辑表单
        let fields = '';
        for (const [key, value] of Object.entries(record)) {
            if (['id', 'createdAt'].includes(key)) continue;
            const label = this.getFieldLabel(key);
            if (!label) continue;

            if (key === 'note' || key === 'reaction' || key === 'symptom' || key === 'diagnosis' || key === 'prescription' ||
                key === 'result' || key === 'advice' || key === 'content' || key === 'description' || key === 'reaction') {
                fields += `<div class="form-group"><label class="form-label">${label}</label><textarea class="form-textarea" id="edit_${key}">${this.escape(value || '')}</textarea></div>`;
            } else if (key === 'date') {
                fields += `<div class="form-group"><label class="form-label">${label} <span class="required">*</span></label><input type="date" class="form-input" id="edit_${key}" value="${value || ''}"></div>`;
            } else {
                fields += `<div class="form-group"><label class="form-label">${label}</label><input type="text" class="form-input" id="edit_${key}" value="${this.escape(value || '')}"></div>`;
            }
        }

        this.showModal('编辑记录', fields, () => {
            const updates = {};
            for (const [key] of Object.entries(record)) {
                if (['id', 'createdAt'].includes(key)) continue;
                const el = document.getElementById('edit_' + key);
                if (el) updates[key] = el.value;
            }
            Storage.update(type, id, updates);
            this.renderAll();
            const activePage = document.querySelector('.page.active').id.replace('page-', '');
            this.switchPage(activePage);
            this.toast('记录已更新');
        });
    },

    getFieldLabel(key) {
        const labels = {
            date: '日期', time: '时间', startTime: '开始时间', endTime: '结束时间',
            duration: '时长', type: '类型', amount: '数量', unit: '单位',
            vaccineName: '疫苗名称', dose: '剂次', location: '地点', batchNo: '批号',
            reaction: '接种反应', cost: '费用', doctor: '医生', hospital: '医院',
            department: '科室', symptom: '症状', diagnosis: '诊断', prescription: '处方',
            note: '备注', age: '月龄', height: '身高(cm)', weight: '体重(kg)',
            headCircumference: '头围(cm)', fontanelle: '前囟门(cm)', result: '结果',
            advice: '建议', drugName: '药品名称', dosage: '剂量', frequency: '频率',
            food: '食物', method: '方式', content: '内容', title: '标题',
            milestone: '里程碑', skill: '技能', description: '描述', date: '日期'
        };
        return labels[key] || key;
    },

                <button class="add-btn" onclick="App.importData()" style="background:#C7CEEA;color:#333">📥 导入数据</button>
                <button class="danger-btn" onclick="App.clearAllData()">🗑 清空所有数据</button>
            </div>
            <div class="settings-section" style="text-align:center;margin-top:20px">
                <div style="color:var(--text-lighter);font-size:12px">
                    宝宝成长记 v1.0<br>用心记录每一刻成长 ❤️
                </div>
            </div>
        `;

        this.showModal('设置', body, () => {
            // 检查是否有新上传的头像
            if (window._avatarDataUrl) {
                const db = Storage.load();
                db.baby.avatar = window._avatarDataUrl;
                Storage.save(db);
                this.renderBabyInfo();
                window._avatarDataUrl = null;
            }
            const storyTime = document.getElementById('storyTimeInput').value;
            const outdoorGoal = parseInt(document.getElementById('outdoorGoalInput').value) || 120;
            const sleepGoal = parseFloat(document.getElementById('sleepGoalInput').value) || 14;
            Storage.updateSettings({ storyTime, outdoorGoal, sleepGoal });
            this.toast('设置已保存');
        });

        // 设置弹窗里的头像上传
        setTimeout(() => {
            const settingsUpload = document.getElementById('settingsAvatarUpload');
            const settingsInput = document.getElementById('settingsAvatarInput');
            const settingsPreview = document.getElementById('settingsAvatarPreview');
            if (settingsUpload && settingsInput) {
                settingsUpload.addEventListener('click', () => settingsInput.click());
                settingsInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    if (file.size > 2 * 1024 * 1024) { this.toast('图片不能超过2MB'); return; }
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        window._avatarDataUrl = ev.target.result;
                        if (settingsPreview) {
                            settingsPreview.innerHTML = `<img src="${ev.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
                        }
                    };
                    reader.readAsDataURL(file);
                });
            }
        }, 100);
    },

    exportData() {
        const data = Storage.export();
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `baby-tracker-${Utils.todayStr()}.json`;
        a.click();
        URL.revokeObjectURL(url);
        this.toast('数据已导出');
    },

    importData() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json';
        input.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    Storage.import(ev.target.result);
                    this.renderAll();
                    this.renderDashboard();
                    this.closeModal();
                    this.toast('数据导入成功');
                } catch (err) {
                    this.toast('导入失败：文件格式错误');
                }
            };
            reader.readAsText(file);
        };
        input.click();
    },

    clearAllData() {
        if (!confirm('⚠️ 确定清空所有数据吗？此操作不可恢复！')) return;
        if (!confirm('再次确认：所有记录将被永久删除！')) return;
        Storage.clear();
        location.reload();
    },

    // ===== 辅助方法 =====
    val(id) {
        const el = document.getElementById(id);
        return el ? el.value.trim() : '';
    },

    escape(str) {
        if (str == null) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    },

    bindChips(containerId, callback) {
        const container = document.getElementById(containerId);
        if (!container) return;
        // 检查是否多选模式：容器上有 data-multi 属性
        const isMulti = container.dataset.multi === 'true';
        container.querySelectorAll('.form-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                if (isMulti) {
                    chip.classList.toggle('active');
                } else {
                    container.querySelectorAll('.form-chip').forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                }
                if (callback) callback(chip.dataset.value, chip);
            });
        });
    },

    // 获取多选 chips 的值（用逗号分隔）
    getMultiChipValues(containerId) {
        const container = document.getElementById(containerId);
        if (!container) return '';
        return Array.from(container.querySelectorAll('.form-chip.active'))
            .map(c => c.dataset.value).join(',');
    },

    counter(id, delta) {
        const el = document.getElementById(id);
        if (!el) return;
        let val = parseInt(el.value) || 0;
        val = Math.max(0, val + delta);
        el.value = val;
    },

    toast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(this._toastTimer);
        this._toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
    },

    // ===== PWA =====
    registerSW() {
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister())).catch(err => console.log('SW注册失败', err));
        }
    },

    showInstallPrompt() {
        // 检测是否已在standalone模式
        if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
            return; // 已安装
        }

        // 延迟显示安装提示
        setTimeout(() => {
            if (!localStorage.getItem('install_dismissed')) {
                this.showInstallBanner();
            }
        }, 3000);
    },

    showInstallBanner() {
        // 如果已有banner则不重复显示
        if (document.querySelector('.install-banner')) return;

        const banner = document.createElement('div');
        banner.className = 'install-banner show';
        banner.innerHTML = `
            <div class="install-icon">📱</div>
            <div class="install-text">
                <div class="install-title">添加到主屏幕</div>
                <div class="install-desc">像APP一样使用，更方便记录</div>
            </div>
            <button class="install-action" id="installBtn">安装</button>
            <button class="install-dismiss" id="installDismiss">✕</button>
        `;
        document.body.appendChild(banner);

        document.getElementById('installBtn').addEventListener('click', () => {
            if (this.deferredPrompt) {
                this.deferredPrompt.prompt();
                this.deferredPrompt.userChoice.then(() => {
                    this.deferredPrompt = null;
                    banner.remove();
                });
            } else {
                this.showInstallGuide();
                banner.remove();
            }
        });

        document.getElementById('installDismiss').addEventListener('click', () => {
            banner.remove();
            localStorage.setItem('install_dismissed', '1');
        });
    },

    showInstallGuide() {
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        const guide = isIOS
            ? `点击 Safari 底部的<strong>分享按钮</strong>📤<br>选择<strong>"添加到主屏幕"</strong><br>点击<strong>"添加"</strong>即可安装`
            : `点击浏览器菜单<strong>⋮</strong><br>选择<strong>"添加到主屏幕"</strong>或<strong>"安装应用"</strong>`;

        this.showModal('安装到手机桌面', `
            <div style="text-align:center;padding:20px 0;line-height:2">
                <div style="font-size:48px;margin-bottom:16px">📱</div>
                <div style="font-size:15px;color:var(--text)">${guide}</div>
            </div>
        `, null);

        // 隐藏取消按钮，只显示关闭
        document.getElementById('modalCancel').style.display = 'none';
        document.getElementById('modalConfirm').textContent = '知道了';
    }
};

// 启动应用
document.addEventListener('DOMContentLoaded', () => App.init());
</script>
