<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#FFB7C5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="宝宝成长">
    <meta name="description" content="记录宝宝成长的每一天">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
    <link rel="icon" type="image/png" href="assets/icon-192.png">
    <link rel="stylesheet" href="css/style.css">
    <title>宝宝成长记</title>
</head>
<body>
    <div id="app">
        <!-- 左侧边栏导航 - 极简图标风格 -->
        <nav class="sidebar-nav">
            <div class="sidebar-menu">
                <button class="nav-btn active" data-page="dashboard" title="首页">
                    <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    <span class="nav-label">首页</span>
                </button>
                <button class="nav-btn" data-page="health" title="健康">
                    <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                    <span class="nav-label">健康</span>
                </button>
                <button class="nav-btn" data-page="daily" title="日常">
                    <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    <span class="nav-label">日常</span>
                </button>
                <button class="nav-btn" data-page="early" title="早教">
                    <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><line x1="12" y1="6" x2="12" y2="10"/><line x1="10" y1="8" x2="14" y2="8"/></svg>
                    <span class="nav-label">早教</span>
                </button>
                <button class="nav-btn" data-page="shopping" title="购物">
                    <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                    <span class="nav-label">购物</span>
                </button>
                <button class="nav-btn" data-page="growth" title="成长">
                    <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
                    <span class="nav-label">成长</span>
                </button>
                <button class="nav-btn" data-page="diary" title="日记">
                    <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                    <span class="nav-label">日记</span>
                </button>
            </div>
            <div class="sidebar-footer">
                <button class="nav-btn" id="sidebarSettings" title="设置">
                    <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    <span class="nav-label">设置</span>
                </button>
            </div>
        </nav>

        <!-- 主内容区 -->
        <div class="main-wrapper">
            <!-- 顶部状态栏 - 极简设计 -->
            <header class="app-header">
                <div class="header-content">
                    <div class="header-logo">安安成长工作台</div>
                </div>
            </header>

            <main class="app-main" id="mainContent">
            <!-- 首页仪表盘 -->
            <section class="page page-dashboard active" id="page-dashboard">
                <!-- 居中宝宝头像 -->
                <div class="dash-avatar-section">
                    <div class="dash-avatar-ring">
                        <div class="dash-avatar" id="dashAvatar" title="点击更换头像">👶</div>
                    </div>
                    <div class="dash-baby-name" id="dashBabyName">宝宝</div>
                    <div class="dash-baby-age" id="dashBabyAge">0个月</div>
                    <div class="dash-greeting" id="greeting">早安 👋</div>
                </div>

                <!-- 今日概览大卡片 -->
                <div class="dash-overview-card">
                    <div class="dash-overview-header">
                        <div class="dash-overview-title">今日概览</div>
                        <div class="dash-overview-date" id="todayDate"></div>
                    </div>
                    <div class="dash-overview-stats">
                        <div class="dash-stat" data-nav="feeding">
                            <div class="dash-stat-icon">🍼</div>
                            <div class="dash-stat-value" id="todayFeeding">0次</div>
                            <div class="dash-stat-label">喂养</div>
                        </div>
                        <div class="dash-stat" data-nav="sleep">
                            <div class="dash-stat-icon">😴</div>
                            <div class="dash-stat-value" id="todaySleep">0h</div>
                            <div class="dash-stat-label">睡眠</div>
                        </div>
                        <div class="dash-stat" data-nav="diaper">
                            <div class="dash-stat-icon">🧷</div>
                            <div class="dash-stat-value" id="todayOutdoor">0次</div>
                            <div class="dash-stat-label">尿布</div>
                        </div>
                        <div class="dash-stat" data-nav="bath">
                            <div class="dash-stat-icon">🛁</div>
                            <div class="dash-stat-value" id="todayStory">0次</div>
                            <div class="dash-stat-label">洗澡</div>
                        </div>
                    </div>
                </div>

                <!-- 今日待办 -->
                <div class="dash-todo-card">
                    <div class="dash-todo-header">
                        <div class="dash-todo-title">今日待办</div>
                        <div class="dash-todo-count" id="todoCount">0/4</div>
                    </div>
                    <div class="dash-todo-list" id="todoList">
                        <label class="dash-todo-item">
                            <input type="checkbox" data-todo="feeding">
                            <span class="todo-check"></span>
                            <span class="todo-text">记录今日喂养</span>
                        </label>
                        <label class="dash-todo-item">
                            <input type="checkbox" data-todo="sleep">
                            <span class="todo-check"></span>
                            <span class="todo-text">记录今日睡眠</span>
                        </label>
                        <label class="dash-todo-item">
                            <input type="checkbox" data-todo="diaper">
                            <span class="todo-check"></span>
                            <span class="todo-text">记录今日尿布</span>
                        </label>
                        <label class="dash-todo-item">
                            <input type="checkbox" data-todo="bath">
                            <span class="todo-check"></span>
                            <span class="todo-text">记录今日洗澡</span>
                        </label>
                    </div>
                </div>

                <!-- 快捷记录 -->
                <div class="dash-quick-actions">
                    <button class="dash-quick-btn" data-action="quick-feed">
                        <span class="dash-quick-icon">🍼</span>
                        <span>喂奶</span>
                    </button>
                    <button class="dash-quick-btn" data-action="quick-sleep">
                        <span class="dash-quick-icon">😴</span>
                        <span>睡眠</span>
                    </button>
                    <button class="dash-quick-btn" data-action="quick-diaper">
                        <span class="dash-quick-icon">🧷</span>
                        <span>尿布</span>
                    </button>
                    <button class="dash-quick-btn" data-action="quick-bath">
                        <span class="dash-quick-icon">🛁</span>
                        <span>洗澡</span>
                    </button>
                    <button class="dash-quick-btn" data-action="quick-diary">
                        <span class="dash-quick-icon">📝</span>
                        <span>日记</span>
                    </button>
                </div>

                <!-- 今日时间线 -->
                <div class="dash-timeline-header">
                    <div class="dash-timeline-title">今日时间线</div>
                    <button class="dash-timeline-clear" id="clearTodayTimeline">清空</button>
                </div>
                <div class="timeline" id="todayTimeline">
                    <div class="empty-state">还没有记录，点击上方按钮开始吧</div>
                </div>
            </section>

            <!-- 健康档案页 -->
            <section class="page" id="page-health">
                <div class="section-title">健康档案</div>
                <div class="health-nav">
                    <button class="health-tab active" data-tab="medical">🏥 就医记录</button>
                    <button class="health-tab" data-tab="vaccine">💉 疫苗接种</button>
                    <button class="health-tab" data-tab="checkup">📋 儿保体检</button>
                    <button class="health-tab" data-tab="medication">💊 用药记录</button>
                </div>

                <!-- 就医记录 -->
                <div class="health-content active" id="tab-medical">
                    <button class="add-btn" data-add="medical">+ 添加就医记录</button>
                    <div class="record-list" id="medicalList"></div>
                </div>

                <!-- 疫苗接种 -->
                <div class="health-content" id="tab-vaccine">
                    <button class="add-btn" data-add="vaccine">+ 添加疫苗记录</button>
                    <div class="record-list" id="vaccineList"></div>
                </div>

                <!-- 儿保体检 -->
                <div class="health-content" id="tab-checkup">
                    <button class="add-btn" data-add="checkup">+ 添加体检记录</button>
                    <div class="record-list" id="checkupList"></div>
                </div>

                <!-- 用药记录 -->
                <div class="health-content" id="tab-medication">
                    <button class="add-btn" data-add="medication">+ 添加用药记录</button>
                    <div class="record-list" id="medicationList"></div>
                </div>
            </section>

            <!-- 日常记录页 -->
            <section class="page" id="page-daily">
                <div class="section-title">日常记录</div>
                <div class="daily-date-selector">
                    <button class="date-arrow" id="prevDay">‹</button>
                    <div class="date-display" id="dailyDate"></div>
                    <button class="date-arrow" id="nextDay">›</button>
                </div>

                <div class="daily-nav">
                    <button class="daily-tab active" data-dtab="feeding">🍼 喂养</button>
                    <button class="daily-tab" data-dtab="sleep">😴 睡眠</button>
                    <button class="daily-tab" data-dtab="diaper">🧷 尿布</button>
                    <button class="daily-tab" data-dtab="bath">🛁 洗澡</button>
                </div>

                <div class="daily-content active" id="dtab-feeding">
                    <button class="add-btn" data-dadd="feeding">+ 记录喂养</button>
                    <div class="record-list" id="feedingList"></div>
                </div>
                <div class="daily-content" id="dtab-sleep">
                    <button class="add-btn" data-dadd="sleep">+ 记录睡眠</button>
                    <div class="record-list" id="sleepList"></div>
                </div>
                <div class="daily-content" id="dtab-diaper">
                    <button class="add-btn" data-dadd="diaper">+ 记录尿布</button>
                    <div class="record-list" id="diaperList"></div>
                </div>
                <div class="daily-content" id="dtab-bath">
                    <button class="add-btn" data-dadd="bath">+ 记录洗澡</button>
                    <div class="record-list" id="bathList"></div>
                </div>
            </section>

            <!-- 成长发育页 -->
            <section class="page" id="page-growth">
                <div class="section-title">成长发育</div>

                <!-- 身高体重 -->
                <div class="growth-section">
                    <div class="growth-section-title">📏 身高体重</div>
                    <button class="add-btn" data-add="growth">+ 记录身高体重</button>
                    <div class="growth-stats" id="growthStats"></div>
                    <div class="chart-container">
                        <canvas id="growthChart"></canvas>
                    </div>
                    <div class="record-list" id="growthList"></div>
                </div>

                <!-- 发育里程碑 -->
                <div class="growth-section">
                    <div class="growth-section-title">⭐ 发育里程碑</div>
                    <button class="add-btn" data-add="milestone">+ 记录里程碑</button>
                    <div class="milestone-list" id="milestoneList"></div>
                </div>

                <!-- 运动发展 -->
                <div class="growth-section">
                    <div class="growth-section-title">🏃 运动发展</div>
                    <button class="add-btn" data-add="motor">+ 记录运动发展</button>
                    <div class="record-list" id="motorList"></div>
                </div>
            </section>

            <!-- 日记相册页 -->
            <section class="page" id="page-diary">
                <div class="section-title">成长日记</div>
                <button class="add-btn" data-add="diary">+ 写新日记</button>
                <div class="diary-list" id="diaryList"></div>
            </section>

            <!-- 早教页面 -->
            <section class="page" id="page-early">
                <div class="section-title">早教启蒙</div>
                <div class="early-nav">
                    <button class="early-tab active" data-etab="outdoor">🌳 户外</button>
                    <button class="early-tab" data-etab="exercise">🤸 运动</button>
                    <button class="early-tab" data-etab="story">📖 绘本</button>
                    <button class="early-tab" data-etab="music">🎵 音乐</button>
                    <button class="early-tab" data-etab="customEarly" id="earlyCustomTabBtn">➕ 自定义</button>
                </div>

                <div class="early-content active" id="etab-outdoor">
                    <button class="add-btn" data-eadd="outdoor">+ 记录户外</button>
                    <div class="record-list" id="earlyOutdoorList"></div>
                </div>
                <div class="early-content" id="etab-exercise">
                    <button class="add-btn" data-eadd="exercise">+ 记录运动</button>
                    <div class="record-list" id="earlyExerciseList"></div>
                </div>
                <div class="early-content" id="etab-story">
                    <button class="add-btn" data-eadd="story">+ 记录绘本</button>
                    <div class="record-list" id="earlyStoryList"></div>
                </div>
                <div class="early-content" id="etab-music">
                    <button class="add-btn" data-eadd="music">+ 记录音乐</button>
                    <div class="record-list" id="musicList"></div>
                </div>
                <div class="early-content" id="etab-customEarly">
                    <button class="add-btn" data-eadd="customEarly">+ 添加自定义记录</button>
                    <div class="record-list" id="customEarlyList"></div>
                </div>
            </section>

            <!-- 购物页面 -->
            <section class="page" id="page-shopping">
                <div class="section-title">购物清单</div>
                <button class="add-btn" data-add="shopping">+ 添加购物记录</button>
                <div class="shopping-summary" id="shoppingSummary"></div>
                <div class="record-list" id="shoppingList"></div>
            </section>
        </main>
        </div>
    </div>

    <!-- 模态框 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">标题</div>
                <button class="modal-close" id="modalClose">✕</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer">
                <button class="btn-cancel" id="modalCancel">取消</button>
                <button class="btn-confirm" id="modalConfirm">确定</button>
            </div>
        </div>
    </div>

    <!-- Toast提示 -->
    <div class="toast" id="toast"></div>

    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <input type="file" id="avatarFileInput" accept="image/*" style="display:none">
</body>
</html>
